# Genere par init.sh depuis fabrique.yml et apps/*/app.yml.
# NE PAS EDITER — ./init.sh --check refuse un compose desynchronise.
#
# Une seule stack dockhand. Le rayon de souffle est commun : une erreur dans un
# bloc fait echouer le deploiement de toute la fabrique.
#
# DEUX SORTES DE SERVICES cohabitent ici, dans un espace de noms plat, et UNE
# SEULE EST ROUTEE :
#
#   <app>          l'application elle-meme, decrite par apps/<app>/app.yml.
#                  Seule sorte a porter des labels de ROUTAGE : un routeur, une
#                  URL https://<app>.apps.billbob.ovh, un middleware
#                  d'authentification Google et priority=100.
#   <nom>          service partage par plusieurs applications (shared_services
#                  dans fabrique.yml). Le meme unique label.
#
# Toutes vivent sur le meme reseau apps_net et se joignent entre elles par
# leur nom de service ; aucune ne publie de port sur l'hote. Ce qui expose un
# service a Internet, ce sont ses labels Traefik, pas le reseau — mais l'absence
# de label n'est PAS une protection : avec exposedByDefault, qui est le DEFAUT,
# un conteneur sans le moindre label recoit quand meme un routeur, donc une URL,
# et sans middleware d'authentification. Seul traefik.enable=false l'en retire ;
# c'est pourquoi il est pose sur chaque service non route ci-dessous.
services:

  # >>> ardoise — DESACTIVEE (enabled: false dans apps/ardoise/app.yml)
  # Aucun service n'est emis. La stack est unique : referencer une image qui
  # n'existe pas encore ferait echouer le « compose up » de TOUTES les apps.
  # Publie l'image d'abord, passe enabled a true ensuite.
  # <<< ardoise

  # >>> cadran — apps/cadran/app.yml — https://cadran.apps.billbob.ovh
  cadran:
    image: ghcr.io/billbob-space/hello-world/cadran:main
    container_name: cadran
    restart: unless-stopped
    mem_limit: 128m
    # Le tag :main est mutable : l'image locale portant ce nom est presque
    # toujours perimee. Sans ce reglage, un redeploiement relance l'image deja
    # presente et sert silencieusement la version precedente.
    pull_policy: always
    # Aucun port publie : Traefik joint le conteneur par le reseau apps_net.
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Journaux bornes : le disque du serveur est a 92 %, et la fabrique
    # multiplie les services. Un json-file non borne les remplirait.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      # priority=100 est OBLIGATOIRE : un routeur catch-all capte tout
      # *.apps.billbob.ovh par HostRegexp, et sa regle est plus longue que ce
      # Host(). Traefik departageant par longueur de regle, il gagnerait et
      # servirait un 404 silencieux.
      - "traefik.enable=true"
      - "traefik.http.routers.cadran.rule=Host(`cadran.apps.billbob.ovh`)"
      - "traefik.http.routers.cadran.entrypoints=websecure"
      - "traefik.http.routers.cadran.priority=100"
      # forwardauth = authentification Google + liste blanche du serveur
      # (exposure private). La retirer exposerait l'app en clair.
      - "traefik.http.routers.cadran.middlewares=forwardauth,security-headers@file"
      - "traefik.http.routers.cadran.tls.certresolver=letsencrypt"
      - "traefik.http.services.cadran.loadbalancer.server.port=8080"
      - "traefik.docker.network=apps_net"
    networks: [apps_net]
  # <<< cadran

  # >>> compteur — DESACTIVEE (enabled: false dans apps/compteur/app.yml)
  # Aucun service n'est emis. La stack est unique : referencer une image qui
  # n'existe pas encore ferait echouer le « compose up » de TOUTES les apps.
  # Publie l'image d'abord, passe enabled a true ensuite.
  # <<< compteur

  # >>> hello-world — apps/hello-world/app.yml — https://hello-world.apps.billbob.ovh
  hello-world:
    image: ghcr.io/billbob-space/hello-world/hello-world:main
    container_name: hello-world
    restart: unless-stopped
    mem_limit: 128m
    # Le tag :main est mutable : l'image locale portant ce nom est presque
    # toujours perimee. Sans ce reglage, un redeploiement relance l'image deja
    # presente et sert silencieusement la version precedente.
    pull_policy: always
    # Aucun port publie : Traefik joint le conteneur par le reseau apps_net.
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Journaux bornes : le disque du serveur est a 92 %, et la fabrique
    # multiplie les services. Un json-file non borne les remplirait.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      # priority=100 est OBLIGATOIRE : un routeur catch-all capte tout
      # *.apps.billbob.ovh par HostRegexp, et sa regle est plus longue que ce
      # Host(). Traefik departageant par longueur de regle, il gagnerait et
      # servirait un 404 silencieux.
      - "traefik.enable=true"
      - "traefik.http.routers.hello-world.rule=Host(`hello-world.apps.billbob.ovh`)"
      - "traefik.http.routers.hello-world.entrypoints=websecure"
      - "traefik.http.routers.hello-world.priority=100"
      # forwardauth = authentification Google + liste blanche du serveur
      # (exposure private). La retirer exposerait l'app en clair.
      - "traefik.http.routers.hello-world.middlewares=forwardauth,security-headers@file"
      - "traefik.http.routers.hello-world.tls.certresolver=letsencrypt"
      - "traefik.http.services.hello-world.loadbalancer.server.port=8080"
      - "traefik.docker.network=apps_net"
    networks: [apps_net]
  # <<< hello-world

  # >>> ramure — apps/ramure/app.yml — https://ramure.apps.billbob.ovh
  ramure:
    image: ghcr.io/billbob-space/hello-world/ramure:main
    container_name: ramure
    restart: unless-stopped
    mem_limit: 128m
    # Le tag :main est mutable : l'image locale portant ce nom est presque
    # toujours perimee. Sans ce reglage, un redeploiement relance l'image deja
    # presente et sert silencieusement la version precedente.
    pull_policy: always
    # Aucun port publie : Traefik joint le conteneur par le reseau apps_net.
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Journaux bornes : le disque du serveur est a 92 %, et la fabrique
    # multiplie les services. Un json-file non borne les remplirait.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      # priority=100 est OBLIGATOIRE : un routeur catch-all capte tout
      # *.apps.billbob.ovh par HostRegexp, et sa regle est plus longue que ce
      # Host(). Traefik departageant par longueur de regle, il gagnerait et
      # servirait un 404 silencieux.
      - "traefik.enable=true"
      - "traefik.http.routers.ramure.rule=Host(`ramure.apps.billbob.ovh`)"
      - "traefik.http.routers.ramure.entrypoints=websecure"
      - "traefik.http.routers.ramure.priority=100"
      # forwardauth = authentification Google + liste blanche du serveur
      # (exposure private). La retirer exposerait l'app en clair.
      - "traefik.http.routers.ramure.middlewares=forwardauth,security-headers@file"
      - "traefik.http.routers.ramure.tls.certresolver=letsencrypt"
      - "traefik.http.services.ramure.loadbalancer.server.port=8080"
      - "traefik.docker.network=apps_net"
    networks: [apps_net]
  # <<< ramure

  # ===== services partages — fabrique.yml, cle shared_services =====
  # Un seul exemplaire pour toute la fabrique, joignable par son nom de service
  # depuis n'importe quelle app d'apps_net, et jamais route vers l'exterieur.
  # Une app declare sa dependance avec « needs: » dans son app.yml.

  # >>> redis — service partage — fabrique.yml
  redis:
    image: valkey/valkey:8-alpine
    container_name: redis
    restart: unless-stopped
    mem_limit: 96m
    # Le tag est souvent mutable : sans ce reglage, un redeploiement relance
    # l'image locale deja presente et sert silencieusement la version d'avant.
    pull_policy: always
    # Service NON ROUTE : aucune URL, aucun middleware a oublier. Il vit sur
    # apps_net, ou ses voisins le joignent par « redis ». Aucun port publie non
    # plus. Ce n'est PAS l'absence de label qui l'en retire — voir « labels: »
    # plus bas, qui est la seule chose a le faire.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [apps_net]
    # LE label qui compte sur un service non route : c'est le seul qui RETIRE du
    # routage. Sans lui, exposedByDefault suffit a creer un routeur sans
    # authentification, et un LABEL traefik.* grave dans l'image publierait une
    # route que ce fichier ne peut pas ecraser. Inoffensif si le serveur pose
    # deja exposedByDefault: false, indispensable sinon.
    labels:
      - "traefik.enable=false"
    command: ["valkey-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
  # <<< redis

networks:
  apps_net:
    external: true
