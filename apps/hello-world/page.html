  :root {
    color-scheme: dark;

    /* Le panneau est un objet physique : noir sous toute lumiere ambiante,
       donc pas de variante claire. */
    --room:      #050506;
    --frame:     #0e0f11;  /* la face du caisson */
    --bezel:     #1e2025;  /* l'arete du cadre, qui prend la lumiere */
    --ink:       #f0ece2;  /* les lettres : blanc chaud, jamais pur */
    --silk:      #8f8b80;  /* serigraphie courante, teintee depuis l'encre */
    --silk-hi:   #bab4a6;  /* serigraphie de tete */
    --signal:    #f2a52a;  /* l'ambre : l'identite et le focus clavier, rien d'autre */

    --board: "Martian Mono", ui-monospace, SFMono-Regular, "DejaVu Sans Mono",
             Menlo, Consolas, monospace;
    --silk-face: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: clamp(.9rem, 3.5vw, 2.5rem);
    /* Le mur est une surface, pas un aplat : le panneau y est pose. */
    background: radial-gradient(115% 80% at 50% 26%, #101114 0%, #08090a 46%, var(--room) 100%);
    color: var(--ink);
    font-family: var(--silk-face);
    font-size: 16px;
    -webkit-text-size-adjust: 100%;
  }

  /* ---- le caisson -------------------------------------------------------
     Largeur dictee par les modules, jamais l'inverse : le boitier est monte
     autour de la matrice, comme sur un vrai panneau. */

  .board {
    position: relative;
    width: max-content;
    max-width: 100%;
    padding: clamp(1.1rem, 3.6vw, 1.7rem) clamp(.85rem, 3.2vw, 1.5rem)
             clamp(.9rem, 3vw, 1.3rem);
    background: linear-gradient(180deg, #131418 0%, var(--frame) 34%, #0a0b0d 100%);
    border-radius: 7px;
    box-shadow:
      inset 0 0 0 1px var(--bezel),           /* l'arete interieure du cadre */
      inset 0 2px 0 rgba(255, 255, 255, .07), /* le chant superieur, eclaire */
      inset 0 -14px 22px -14px rgba(0, 0, 0, .95),
      0 2px 0 #000,
      0 34px 66px -28px rgba(0, 0, 0, .95);   /* le panneau decolle du mur */
  }

  /* Les quatre vis de fixation du cadre. */
  .screws {
    position: absolute;
    inset: 7px;
    pointer-events: none;
    background-image:
      radial-gradient(circle at 50% 44%, #4a4c53 0 1.6px, #24262b 1.9px, #101116 2.9px, transparent 3.2px),
      radial-gradient(circle at 50% 44%, #4a4c53 0 1.6px, #24262b 1.9px, #101116 2.9px, transparent 3.2px),
      radial-gradient(circle at 50% 44%, #4a4c53 0 1.6px, #24262b 1.9px, #101116 2.9px, transparent 3.2px),
      radial-gradient(circle at 50% 44%, #4a4c53 0 1.6px, #24262b 1.9px, #101116 2.9px, transparent 3.2px);
    background-size: 7px 7px;
    background-repeat: no-repeat;
    background-position: left top, right top, left bottom, right bottom;
  }

  /* ---- la plaque de nom -------------------------------------------------
     Gravee dans la tole du caisson : creuse, pas serigraphiee comme les
     etiquettes de champ. */

  .plate {
    display: inline-block;
    margin-bottom: clamp(1rem, 3vw, 1.4rem);
    padding: .3rem .7rem .34rem;
    border-radius: 2px;
    background: linear-gradient(180deg, #0a0b0d, #131418);
    box-shadow:
      inset 0 1px 2px rgba(0, 0, 0, .9),
      0 1px 0 rgba(255, 255, 255, .045);
  }

  h1 {
    margin: 0;
    font-size: .82rem;
    font-weight: 700;
    letter-spacing: .3em;
    text-indent: .3em;      /* compense la chasse ajoutee au dernier signe */
    text-transform: uppercase;
    color: #a9a396;
  }

  /* ---- etiquettes serigraphiees, rangees ------------------------------- */

  .cap {
    margin: 0 0 .5rem;
    font-weight: 600;
    text-transform: uppercase;
    color: var(--silk);
    font-size: .63rem;
    letter-spacing: .19em;
  }

  /* L'etiquette de tete : plus grande, plus claire, elle ouvre le panneau. */
  .cap--lead {
    font-size: .78rem;
    letter-spacing: .24em;
    color: var(--silk-hi);
  }

  /* ---- les modules a volets ---------------------------------------------
     Chaque volet est un element reel : face qui recoit la lumiere en haut,
     jeu sombre a la charniere, arete eclairee sur le volet inferieur, et
     l'ombre du volet avant portee sur celui de derriere. Le compte de
     cellules est fixe, donc la bande fait toujours un nombre entier de
     volets — jamais de demi-carte coupee au bord. */

  .strip {
    position: relative;
    font-family: var(--board);
    font-weight: 600;
    /* Une cellule = une chasse exactement. Toute chasse ajoutee se decalerait
       du pas de la grille et la derive s'accumulerait sur onze cellules. */
    --cellw: 1ch;
    --flaph: 1.42em;
    width: calc(var(--cells) * var(--cellw));
    max-width: 100%;
    height: var(--flaph);
  }

  .cards {
    position: absolute;
    inset: 0;
    /* `1fr` repartit l'arrondi sur toute la bande au lieu de le laisser
       s'accumuler cellule apres cellule : les cartes restent calees sur les
       glyphes, dont la chasse derive de la meme largeur totale. */
    display: grid;
    grid-template-columns: repeat(var(--cells), 1fr);
    overflow: hidden;
    border-radius: 1.5px;
  }

  .cards i {
    position: relative;
    border-right: 1px solid #050507;
    background: linear-gradient(180deg,
      #303239 0%,          /* haut du volet avant : pleine lumiere */
      #26282e 34%,
      #1b1d22 49.2%,       /* bas du volet avant, dans son propre ombrage */
      #08090b 49.2%, #08090b 50.6%,   /* le jeu de la charniere */
      #35373e 50.6%,       /* arete du volet arriere, qui accroche la lumiere */
      #262830 63%,
      #15161a 100%);
  }

  /* L'ombre portee du volet avant sur le volet arriere. */
  .cards i::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 50.6%;
    height: 30%;
    background: linear-gradient(180deg, rgba(0, 0, 0, .66), rgba(0, 0, 0, 0));
  }

  /* Les tourillons de l'axe, de part et d'autre du module. */
  .strip::before,
  .strip::after {
    content: "";
    position: absolute;
    top: 50%;
    width: .17em;
    height: .17em;
    border-radius: 50%;
    background: linear-gradient(180deg, #55575e, #2a2c31);
    transform: translateY(-50%);
  }
  .strip::before { left: -.32em; }
  .strip::after  { right: -.32em; }

  /* Le champ de texte, pose sur la matrice. Le gabarit reste un simple
     champ : main_test.go verrouille {{"{{.VersionShort}}"}} colle a sa
     balise, donc aucun decoupage caractere par caractere n'est possible. */
  .glyphs {
    position: relative;
    display: block;
    margin: 0;
    line-height: var(--flaph);
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
  }

  /* La fente de charniere passe DEVANT les lettres : sur un panneau a
     palettes, elle coupe chaque caractere en deux, et c'est ce trait qui
     identifie la forme. Une lettre non coupee est imprimee sur une grille,
     pas portee par un volet. Element separe, donc le champ de texte du
     gabarit reste intact. */
  .hinge {
    position: absolute;
    left: 0;
    right: 0;
    top: 50.6%;
    z-index: 2;
    height: .045em;
    min-height: 1px;
    background: linear-gradient(180deg, rgba(3, 3, 4, .92), rgba(3, 3, 4, .78));
    box-shadow: 0 .045em .07em -.02em rgba(0, 0, 0, .55);
    pointer-events: none;
  }

  /* Votre ligne sur le panneau. L'ambre n'est pose que sur une identite
     reellement transmise par Traefik : en local, sans en-tete, la valeur
     reste eteinte plutot que de faire croire a une session. */
  .glyphs.you { color: var(--signal); }
  .glyphs.unset { color: var(--silk); }

  /* ---- la ligne d'affiche ---------------------------------------------- */

  .marquee { margin: 0 0 clamp(1.3rem, 4vw, 1.9rem); }

  /* Le `dd` du navigateur arrive avec 40px de retrait a gauche. Non remis a
     zero, le module de tete se decale de son propre en-tete — et ce retrait
     entre dans le `max-content` du caisson, qui traine alors 40px de vide a
     droite de chaque ligne. */
  .marquee dd { margin: 0; }

  /* Les deux corps sont dans le rapport 30/11, aux trois regimes du clamp :
     les modules font donc exactement la meme largeur a toute taille d'ecran,
     le caisson epouse la matrice et les tourillons tombent sur le cadre. */
  .marquee .strip {
    --cells: 11;
    font-size: clamp(1.78rem, 8.59vw, 4.91rem);
  }

  /* Le SHA complet est la vraie charge utile pour qui compare plus de sept
     signes : lisible et selectionnable d'un clic, jamais une infobulle. */
  /* `width: 0` puis `min-width: 100%` : le SHA s'affiche sur toute la largeur
     du caisson mais ne compte pour rien dans sa largeur intrinseque. Sans
     cela, ses quarante signes insecables etirent un caisson en `max-content`
     bien au-dela de l'ecran d'un telephone. */
  .marquee dd.hash {
    margin: .85rem 0 0;
    width: 0;
    min-width: 100%;
    font-family: var(--board);
    font-size: clamp(.95rem, 2.2vw, 1.25rem);
    letter-spacing: .02em;
    color: #b3ada0;
    overflow-wrap: anywhere;
    user-select: all;
  }

  /* ---- les lignes de depart -------------------------------------------- */

  .rows { margin: 0; }
  .rows dd { margin: 0 0 clamp(.85rem, 2.6vw, 1.15rem); }
  .rows .strip {
    --cells: 30;
    /* Le coefficient est legerement sous le rapport 30/11 exact : la chasse
       reelle est arrondie par le moteur a chaque corps, donc l'egalite
       theorique des largeurs ne tient pas aux petites tailles. Mieux vaut une
       ligne un peu plus courte que le module de tete que l'inverse : c'est le
       module focal qui doit tenir le bord du caisson. */
    font-size: clamp(.6307rem, 2.9vw, 1.8rem);
  }

  /* A 12 px de corps, la bande de charniere et son ombre pesent deux pixels
     sur une hauteur de capitale de neuf : la valeur se lit barree au lieu de
     coupee. Sur les lignes, la fente se passe de son ombre portee. */
  .rows .hinge {
    box-shadow: none;
    background: rgba(3, 3, 4, .82);
  }

  /* ---- la plaque de sonde ---------------------------------------------- */

  footer {
    margin-top: clamp(.6rem, 2.4vw, 1rem);
    padding-top: clamp(.85rem, 2.6vw, 1.15rem);
    border-top: 1px solid #191a1e;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .legend {
    font-size: .6rem;
    font-weight: 600;
    letter-spacing: .17em;
    text-transform: uppercase;
    color: var(--silk);
  }

  .probe {
    font-family: var(--board);
    font-weight: 600;
    font-size: .72rem;
    color: var(--ink);
    text-decoration: none;
    padding: .44rem .7rem;
    border-radius: 2px;
    background: linear-gradient(180deg, #2a2c32, #1a1c20);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .09),
      0 1px 0 #000;
    transition: background 160ms ease-out, transform 160ms ease-out,
                box-shadow 160ms ease-out;
  }
  .probe:hover { background: linear-gradient(180deg, #34363d, #212328); }
  .probe:active {
    transform: translateY(1px);
    background: linear-gradient(180deg, #17181c, #202228);
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, .75);
  }
  .probe:focus-visible {
    outline: 2px solid var(--signal);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .probe { transition: none; }
  }
</style>
</head>
<body>
<!--
THESIS: a deployment is a flap turning — this page is the board showing the
value now in service, not a status card with a green pill.
OWN-WORLD: matte black housing with a bezel and mounting screws, real flap
cards carrying a lit face, a hinge gap and a cast shadow, board lettering in
fixed character cells, axle pins on every module, one amber signal reserved
for the identity row and keyboard focus. No status lamp.
STORY: the visitor merged minutes ago; they read the SHA at board scale,
confirm it is theirs, and leave.
FIRST VIEWPORT: engraved nameplate; "Version en ligne" over the SHA on an
eleven-cell module the board is sized from, full hash beneath; four departure
modules; the /healthz plate closes the frame.
FORM: split-flap departure board, candidate 6 of 7, seed 8ff367b8.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
