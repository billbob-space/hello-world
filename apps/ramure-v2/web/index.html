<!-- apps/ramure-v2/web/index.html -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAMURE</title>
<!-- Installation (N-11, PRP 08) : servis par la route statique EXISTANTE
     /dist/ (internal/api/routes.go), aucune route serveur ajoutee. -->
<link rel="manifest" href="/dist/manifest.webmanifest">
<link rel="icon" href="/dist/icone.svg" type="image/svg+xml">
<meta name="theme-color" content="#0b0b0c">
<style>
  :root { color-scheme: dark light; }
  * { box-sizing: border-box; }
  /* Regle GLOBALE unique (deja vu 3 fois ailleurs dans la fabrique,
     memory/regles-imperatives.md) : toute classe qui declare son propre
     "display" (grid, flex...) a la MEME specificite que la regle UA par
     defaut [hidden]{display:none} et peut la gagner selon l'ordre du
     cascade. Un correctif classe par classe se reproduit a chaque nouvel
     element cache ; celui-ci couvre tous les elements presents et a venir. */
  [hidden] { display: none !important; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0b0b0c;
    color: #ece7dc;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;

    /* Echelle typographique : trois degres, jamais deux voisins a moins d'un
       rapport de 1,25. En deca, l'oeil ne lit plus une hierarchie mais une
       imprecision — c'est le defaut releve sur la premiere version de cet
       ecran, ou 1,1 / 1 / 0,85 se ressemblaient trop pour hierarchiser quoi
       que ce soit. Rapports tenus ici : 1,375 puis 1,25. */
    --texte-titre: 1.375rem;
    --texte-corps: 1rem;
    --texte-second: .8rem;

    /* Echelle d'espacement : six degres, du plus serre (ce qui va ensemble)
       au plus large (ce qui separe des sections) — meme logique que
       l'echelle typographique ci-dessus. Avant cette echelle, quatorze
       valeurs d'espacement differentes cohabitaient sans aucun rythme
       lisible : rien ne distinguait "ces elements vont ensemble" de "ces
       blocs sont deux sections differentes". Chaque degre est reutilise a
       plusieurs endroits, sauf les deux derniers qui codent chacun un
       ecart structurel unique. */
    --espace-1: .25rem;  /* colle : gap interne d'un bouton empile, puce de liste dense */
    --espace-2: .5rem;   /* pas courant : entre elements d'un meme groupe (icones, boutons, libelle+valeur) */
    --espace-3: .75rem;  /* bloc : padding des panneaux, cartes et bannieres */
    --espace-4: 1rem;    /* sous-section : marge entre deux zones proches d'un meme ecran */
    --espace-5: 3rem;    /* hors-champ : offset qui sort un element du cadre (lien d'evitement) */
    --espace-6: 4.5rem;  /* rupture : separation entre le bandeau et les panneaux qui le suivent */
  }
  body { display: grid; grid-template-rows: auto 1fr; }

  /* Lien d'evitement (§12) : invisible tant qu'il n'a pas le focus. */
  .evitement {
    position: absolute; left: 0; top: calc(-1 * var(--espace-5)); z-index: 10;
    background: #f0a828; color: #0b0b0c; padding: var(--espace-3) var(--espace-4);
    text-decoration: none; font-weight: 600;
  }
  .evitement:focus { top: 0; }

  header {
    display: flex; align-items: center; gap: var(--espace-3);
    padding: var(--espace-3) var(--espace-4); border-bottom: 1px solid #232323;
    flex-wrap: wrap;
  }
  header h1 {
    margin: 0; font-size: var(--texte-titre); letter-spacing: .18em; font-weight: 600;
  }
  #recherche { display: flex; gap: var(--espace-2); flex: 1; min-width: 12rem; }
  #recherche input {
    flex: 1; min-width: 0; padding: var(--espace-2) var(--espace-3); border-radius: .4rem;
    border: 1px solid #3a3a3a; background: #161617; color: inherit;
  }
  #recherche button, .camera button {
    padding: var(--espace-2) var(--espace-3); border-radius: .4rem; border: 1px solid #3a3a3a;
    background: #1c1c1e; color: inherit; cursor: pointer;
    min-height: 2.5rem; min-width: 2.5rem;
  }
  .camera { display: flex; gap: var(--espace-2); }

  /* "Remonter d'un cran" (F-14) : memes dimensions minimales que les
     autres commandes de la barre (§12, cible tactile >= 24x24px), mais sa
     PROPRE regle plutot qu'un partage de classe avec .camera button — ce
     n'est pas une commande de camera, la confusion se paierait a la
     lecture du CSS bien avant celle de l'ecran. */
  .precedent {
    padding: var(--espace-2) var(--espace-3); border-radius: .4rem; border: 1px solid #3a3a3a;
    background: #1c1c1e; color: inherit; cursor: pointer;
    min-height: 2.5rem; min-width: 2.5rem; font-size: var(--texte-corps);
  }

  /* Banniere de mise a jour (F-42, N-12) : jamais superposee au contenu,
     jamais un blocage plein ecran — une simple ligne, fermable par
     l'action elle-meme (le clic recharge la page). */
  .mise-a-jour {
    display: flex; align-items: center; justify-content: center; gap: var(--espace-3);
    flex-wrap: wrap; padding: var(--espace-2) var(--espace-3); background: #2a2410; color: #f0d090;
    font-size: var(--texte-second);
  }
  .mise-a-jour button {
    padding: var(--espace-2) var(--espace-3); border-radius: .4rem; border: 1px solid #4a4322;
    background: #1c1c1e; color: inherit; cursor: pointer;
    min-height: 2.5rem; min-width: 2.5rem; font-size: var(--texte-second);
  }

  main { position: relative; overflow: hidden; }
  #canevas { display: block; width: 100%; height: 100%; touch-action: none; }
  .noeud { cursor: pointer; }
  .noeud:focus-visible circle { outline: 3px solid #f0a828; outline-offset: 2px; }
  .libelle { fill: #ece7dc; font-size: 13px; pointer-events: none; }
  .lien { stroke: #4a4a4a; stroke-width: 1.5; }

  /* Critique 2026-08-22 C10 : #etat etait pose en absolu, fond transparent et
     pointer-events par defaut, PAR-DESSUS la fiche. Deux textes superposes,
     et une bande de 182x15 px qui interceptait le pointeur au-dessus d'une
     liste d'albums defilante (verifie : elementFromPoint renvoyait #etat, et
     .discographie-album une fois pointer-events neutralise). Le message garde
     sa place, mais il ne mange plus les clics et il pose son propre fond. */
  #etat {
    position: absolute; left: var(--espace-3); bottom: var(--espace-3); max-width: 22rem;
    font-size: var(--texte-second); color: #8a867c;
    pointer-events: none;
  }
  #etat:not(:empty) {
    background: rgba(10, 10, 11, .92); border-radius: .3rem;
    padding: var(--espace-1) var(--espace-2);
  }

  /* Bande d'echec de plantation (§17 Q6, PRODUCT.md, decision du 22 aout
     2026) : pleine largeur, sous la barre de recherche -- remplace
     l'ancien artiste fantome (un disque au centre portant le nom mal
     orthographie, dementi seulement par une ligne de gris a l'autre bout
     de l'ecran -- critique 2026-08-22 C15). C'est un ETAT, pas une alerte
     qui s'auto-efface (web/src/echec.ts) : elle reste jusqu'a une
     plantation reussie ou un retour a l'accueil. role="alert" (aria-live
     assertive implicite) l'annonce des son apparition -- rien d'autre ne
     signale ce changement d'etat a une technologie d'assistance. Fond et
     texte mesures : ratio de contraste 10.45:1 (WCAG 2.2 AA exige 4.5:1).
     Positionnee (position:absolute, z-index) plutot qu'en flux : elle
     n'affecte jamais la hauteur de <main>, ni le grid de <body>. */
  #echec-plantation {
    position: absolute; top: 0; left: 0; right: 0; z-index: 4;
    margin: 0; padding: var(--espace-3) var(--espace-4);
    background: #2a1010; color: #f5b8ac; font-size: var(--texte-corps);
    border-bottom: 1px solid #4a2020;
  }
  /* L'arbre precedent reste DERRIERE la bande, estompe -- jamais perdu
     (§17 Q6) : assez lisible pour se reperer, sans concurrencer le
     message. pointer-events:none evite qu'un clic sur une branche
     dimmee ne promeuve un noeud pendant que l'echec reste a traiter. */
  #canevas.estompe {
    opacity: .4; pointer-events: none; transition: opacity .15s ease;
  }
  .visuellement-cache {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  .logo {
    background: none; border: none; color: inherit; cursor: pointer;
    font: inherit; font-size: var(--texte-titre); letter-spacing: .18em;
    font-weight: 600; padding: 0;
  }

  /* Suggestions (F-01, F-02) : liste positionnee sous le champ, jamais un
     second champ de recherche — une seule instance dans le document,
     quelle que soit la largeur (parite stricte, PRP 08). */
  #recherche { position: relative; }
  .suggestions {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 5;
    margin: var(--espace-1) 0 0; padding: var(--espace-1); list-style: none;
    background: #161617; border: 1px solid #3a3a3a; border-radius: .4rem;
    max-height: 16rem; overflow-y: auto;
  }
  .suggestions li {
    padding: var(--espace-2) var(--espace-2); border-radius: .3rem; cursor: pointer;
    font-size: var(--texte-corps);
  }
  .suggestions li[aria-selected="true"] { background: #2a2a2c; }

  .correction {
    padding: var(--espace-2) var(--espace-3); margin: 0 var(--espace-4); border-radius: .4rem;
    background: #2a2410; color: #f0d090; font-size: var(--texte-second);
    display: flex; gap: var(--espace-2); align-items: center; flex-wrap: wrap;
  }
  .correction button {
    border: 1px solid #4a4322; background: #1c1c1e; color: inherit;
    border-radius: .3rem; padding: var(--espace-1) var(--espace-2); cursor: pointer;
    font-size: var(--texte-second);
  }

  .service { padding: var(--espace-2) var(--espace-2); border-radius: .4rem; border: 1px solid #3a3a3a; background: #1c1c1e; color: inherit; }
  .partager {
    padding: var(--espace-2) var(--espace-3); border-radius: .4rem; border: 1px solid #3a3a3a;
    background: #1c1c1e; color: inherit; cursor: pointer;
    min-height: 2.5rem; min-width: 2.5rem;
  }

  /* Etat A — accueil (§07) : mur de pochettes plein ecran, sans defilement,
     le nombre de colonnes suit la largeur PAR CSS. */
  .accueil { position: absolute; inset: 0; display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
  .accueil-barre {
    display: flex; align-items: center; justify-content: space-between; gap: var(--espace-3);
    padding: var(--espace-2) var(--espace-3); font-size: var(--texte-second); color: #8a867c;
  }
  /* Critique 2026-08-22 C3 (premiere correction) : `auto-fill` conservait
     les pistes vides, 485 px (34 % de 1440) de noir a droite. `auto-fit`
     les effondre : les colonnes en `minmax(9rem, 1fr)` occupent alors la
     largeur ENTIERE, sans aucun reliquat -- ce mecanisme-la reste
     INCHANGE ci-dessous.
     §17 Q7 (PRODUCT.md, decision du 22 aout 2026, second passage) : le PRD
     parle d'un « mur de POCHETTES » — la premiere correction donnait des
     bandes verticales de rapport 1:3,2 a 1440 (mesure) au lieu du carre que
     l'objet cite designe, `grid-auto-rows: 1fr` etirant chaque rangee sur
     TOUTE la hauteur du conteneur. Piege ecarte : passer les colonnes a une
     taille FIXE (ex. `repeat(auto-fit, 9rem)`) pour forcer le carre
     ROUVRE le vide lateral que C3 venait de fermer — verifie a la mesure,
     pas a l'oeil (web/tests/e2e/accueil-mur.spec.ts). La solution retenue
     touche la RANGEE, jamais la colonne : `aspect-ratio: 1` sur `.tuile`
     fait que sa hauteur suit sa PROPRE largeur (deja stiree a 1fr, zero
     reliquat), et `grid-auto-rows: auto` laisse la rangee s'ajuster a cette
     hauteur plutot que de forcer 100 % du conteneur. Le mur (souvent une
     seule rangee, plus bas que le conteneur) se centre alors verticalement
     -- c'est la « grille centree » retenue. */
  .mur {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
    grid-auto-rows: auto; align-content: center;
    gap: var(--espace-2); padding: var(--espace-2); overflow: hidden; height: 100%;
  }
  .mur-item { min-height: 0; }
  .tuile {
    position: relative; width: 100%; aspect-ratio: 1; border: none; border-radius: .5rem;
    cursor: pointer; overflow: hidden; display: flex; align-items: flex-end;
    padding: 0; color: #ece7dc;
  }
  .tuile-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .tuile-libelle {
    position: relative; z-index: 1; width: 100%; padding: var(--espace-2) var(--espace-2);
    background: linear-gradient(transparent, rgba(0,0,0,.65));
    font-size: var(--texte-second); text-align: left;
  }
  .tuile-apparition { animation: apparition .25s ease both; }
  @keyframes apparition { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .tuile-apparition { animation: none; }
  }

  /* Fiche (F-19) et apercu de survol : DEUX panneaux distincts, jamais l'un
     a la place de l'autre. Meme DOM aux deux largeurs ; seule la CSS
     repositionne (parite stricte, PRP 08). */
  .fiche-panneau, .apercu-panneau {
    position: absolute; background: #161617; border: 1px solid #2a2a2a;
    border-radius: .6rem .6rem 0 0; padding: var(--espace-3); overflow-y: auto;
    left: 0; right: 0; bottom: 0; max-height: 45vh;
  }
  .apercu-panneau { max-height: 8rem; }
  /* Critique 2026-08-22 C13 / C16 : la sortie des panneaux ancres. Elle se
     pose en haut a droite du panneau, hors du flux, pour ne pas decaler le
     titre. 2.5rem = 40px, au-dessus du plancher WCAG 2.5.8 (24px). */
  .panneau-fermer {
    position: absolute; top: var(--espace-2); right: var(--espace-2);
    min-width: 2.5rem; min-height: 2.5rem; padding: 0;
    border: 1px solid #3a3a3a; border-radius: .4rem;
    background: #1c1c1e; color: inherit; cursor: pointer;
    font-size: 1.1rem; line-height: 1;
  }
  .fiche-titre { margin: 0 0 var(--espace-1); font-size: var(--texte-titre); }
  .fiche-presentation, .apercu-nom { font-size: var(--texte-corps); margin: 0 0 var(--espace-2); }
  /* Critique 2026-08-22 C5 / C9 : ces deux selects etaient les SEULS controles
     sans regle CSS — ils retombaient sur le rendu natif, fond blanc dans une
     interface noire, 19 px de haut (plancher WCAG 2.5.8 : 24 px), et le filtre
     de discographie venait toucher le lien d'ecoute a 0 px d'ecart. Ils
     reprennent le traitement deja pose sur .service, qui leur est voisin a
     l'ecran. */
  .discographie-filtre, .tri {
    font-size: var(--texte-second);
    padding: var(--espace-1) var(--espace-2); border-radius: .4rem;
    border: 1px solid #3a3a3a; background: #1c1c1e; color: inherit;
    min-height: 2.5rem;
  }
  .discographie-filtre { margin-bottom: var(--espace-2); margin-left: var(--espace-2); }
  .discographie-album {
    display: flex; gap: var(--espace-2); align-items: baseline; font-size: var(--texte-second);
    padding: var(--espace-1) 0; border-bottom: 1px solid #232323;
  }
  .discographie-titre { flex: 1; }
  .lecteur-bouton, .fiche-lien-artiste, .discographie-lien {
    font-size: var(--texte-second);
  }
  /* Defaut #4 (REFERENCE.md, "color-contrast") corrige : ces deux liens ne
     declaraient aucune couleur de texte et retombaient sur le bleu de lien
     par defaut du navigateur (#0000ee), illisible sur le fond sombre du
     panneau (#161617 -- ratio mesure 1.92:1, WCAG 2 AA exige 4.5:1). Repli
     sur l'accent deja utilise ailleurs dans cet ecran (lien d'evitement,
     contour de focus) plutot qu'une nouvelle couleur : ratio mesure 8.90:1
     sur #161617. */
  .fiche-lien-artiste, .discographie-lien {
    color: #f0a828; text-decoration: underline;
  }

  /* Garder/retirer (F-28) et collection (F-30, F-31, F-33). */
  .fiche-garder {
    display: block; margin: 0 0 var(--espace-2); padding: var(--espace-1) var(--espace-3); border-radius: .4rem;
    border: 1px solid #3a3a3a; background: #1c1c1e; color: inherit; cursor: pointer;
    font-size: var(--texte-second);
  }
  .fiche-garder[aria-pressed="true"] { background: #2a2410; border-color: #4a4322; color: #f0d090; }
  .collection-vide { font-size: var(--texte-corps); color: #8a867c; margin: 0; }
  .collection-liste { list-style: none; margin: 0; padding: 0; }
  .collection-item {
    display: flex; align-items: center; gap: var(--espace-2);
    padding: var(--espace-2) 0; border-bottom: 1px solid #232323;
  }
  .collection-replanter {
    flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: var(--espace-1);
    background: none; border: none; color: inherit; cursor: pointer; padding: 0; text-align: left;
    font: inherit;
  }
  .collection-nom { font-size: var(--texte-corps); }
  .collection-lignee, .collection-date { font-size: var(--texte-second); color: #8a867c; }
  .collection-retirer {
    background: none; border: 1px solid #3a3a3a; border-radius: .3rem; color: inherit;
    cursor: pointer; min-width: 1.8rem; min-height: 1.8rem; line-height: 1; padding: 0;
  }
  @media (min-width: 60rem) {
    .fiche-panneau {
      left: auto; right: var(--espace-4); bottom: var(--espace-4); top: var(--espace-6); width: 22rem;
      border-radius: .6rem; max-height: none;
    }
    .apercu-panneau {
      left: auto; right: var(--espace-4); top: var(--espace-6); bottom: auto; width: 18rem;
      border-radius: .6rem;
    }
  }
</style>
</head>
<body>
<a class="evitement" href="#contenu">Aller au contenu principal</a>
<!-- Texte pose par main.ts depuis textes.ts (miseAJourDisponible,
     miseAJourAppliquer) : jamais fige ici. -->
<div id="mise-a-jour" class="mise-a-jour" role="status" hidden>
  <span id="mise-a-jour-texte"></span>
  <button type="button" id="mise-a-jour-appliquer"></button>
</div>
<header>
  <h1><button type="button" id="logo" class="logo">RAMURE</button></h1>
  <!-- "remonter d'un cran" (F-14, §12) : action DISTINCTE de "quitter
       l'exploration" (le logo ci-dessus) — intitule et glyphe differents,
       jamais les deux memes mots (main.ts pose l'aria-label depuis
       textes.remonterLaLignee). Masque tant que la lignee est vide. -->
  <button type="button" id="remonter-lignee" class="precedent" hidden>‹</button>
  <form id="recherche" role="search" aria-label="Planter un artiste">
    <label class="visuellement-cache" for="graine">Nom d'artiste</label>
    <input id="graine" name="graine" type="text" placeholder="Planter un artiste…" autocomplete="off"
           role="combobox" aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false">
    <button type="submit">Planter</button>
    <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
  </form>
  <p id="correction" class="correction" role="status" hidden></p>
  <!-- aria-label pose par main.ts depuis textes.ts (choisirService,
       zoomerArriere, zoomerAvant) : jamais fige ici, cf. C2 2026-08-22 -
       un libelle en dur ici divergeait deja de textes.ts (accents). -->
  <select id="service" class="service"></select>
  <div class="camera">
    <button type="button" id="zoomer-arriere">−</button>
    <button type="button" id="zoomer-avant">+</button>
    <button type="button" id="cadrage-initial" hidden>Revenir au cadrage initial</button>
    <button type="button" id="partager" class="partager"></button>
    <button type="button" id="collection-bouton" class="partager"></button>
  </div>
</header>
<main id="contenu">
  <!-- Texte pose par main.ts (echec.ts) depuis textes.ts : jamais fige ici,
       comme le reste des chaines de l'ecran (§17 Q6). -->
  <p id="echec-plantation" class="echec-plantation" role="alert" hidden></p>
  <section id="accueil" class="accueil" hidden>
    <div class="accueil-barre">
      <p id="accueil-promesse" class="accueil-promesse"></p>
      <select id="tri" class="tri" aria-label="Trier le mur"></select>
    </div>
    <div id="mur"></div>
  </section>
  <!-- role="group", jamais role="img" (PRP 08) : un role="img" masque ses
       descendants a l'arbre d'accessibilite (aucun enfant expose), ce qui
       rendrait chaque noeud (role="button" ci-dessous, canevas.ts)
       INATTEIGNABLE a une technologie d'assistance malgre son tabindex.
       "group" garde le canevas nomme SANS rien masquer de son contenu. -->
  <svg id="canevas" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Arbre des artistes proches"></svg>
  <aside id="fiche" class="fiche-panneau" hidden></aside>
  <aside id="apercu-branche" class="apercu-panneau" hidden></aside>
  <aside id="collection" class="fiche-panneau" hidden></aside>
  <p id="etat" role="status" aria-live="polite"></p>
</main>
<script type="module" src="/dist/app.js"></script>
</body>
</html>
