# Valeurs communes a toutes les applications de la fabrique.
# Modifie ce fichier puis relance ./init.sh.
org: billbob-space
repo: hello-world                 # entre dans le nom des images : ghcr.io/billbob-space/hello-world/<app>
registry: ghcr.io
domain: apps.billbob.ovh             # chaque app est servie sur <nom-app>.<domain>
network: apps_net           # reseau Docker existant cote serveur
entrypoint: websecure
cert_resolver: letsencrypt
security_headers: security-headers@file
memory_budget: 2048m   # plafond de la somme des mem_limit
image_max_mb: 200
log_max_size: 10m     # cap des journaux json-file, par service
log_max_file: 3

# Ce que coute une branche. « ./scripts/cout.sh » lit la consommation des
# sessions visibles depuis le conteneur et l'ecrit dans l'entree de journal de
# la branche ; ces valeurs sont les seules qu'il ne peut pas deviner.
#
# tarifs — prix public de l'API, en DOLLARS par million de jetons, un mapping
# par modele. Un modele absent de cette liste est compte en jetons mais pas en
# argent, et cout.sh le dit. L'ecriture de cache se facture 1,25x l'entree et sa
# lecture 0,1x : ces deux multiplicateurs valent pour toute l'API, ils vivent
# dans cout.sh et pas ici.
#
# taux_usd_eur / taux_date — le taux de change et le jour ou il a ete releve.
# Ils sont FIGES a la main, delibrement : un outil de verification qui appelle
# le reseau echoue le jour ou le reseau manque. Le montant en euros porte
# toujours cette date, et cout.sh previent quand elle depasse 90 jours.
tarifs:
  - modele: claude-opus-5
    entree: 5
    sortie: 25
  - modele: claude-fable-5
    entree: 10
    sortie: 50
  - modele: claude-sonnet-5
    entree: 3
    sortie: 15
  - modele: claude-haiku-4-5
    entree: 1
    sortie: 5
taux_usd_eur: 0.86843
taux_date: 2026-08-04     # source : Frankfurter, reference BCE

# Les outils de la revue — « ./scripts/revue.sh ». Versions EPINGLEES ici et
# nulle part ailleurs : une version qui vit dans deux fichiers finit par vivre
# a deux versions. Rien ne s'installe, tout passe par « go run <module>@<version> »
# et « npx --yes <paquet>@<version> » ; le premier appel telecharge, et sans
# reseau la revue est KO plutot que verte.
# La chaine Go avec laquelle la revue analyse. EPINGLEE, et c'est ce qui rend son
# verdict reproductible : sans elle, govulncheck rapporte les failles de la
# bibliotheque standard de la version installee sur la MACHINE — 27 sur une app
# saine avec un Go 1.24.7 local, zero avec une chaine a jour. Le meme depot,
# relu sur deux postes, rendait deux verdicts.
#
# Elle vaut aussi pour la construction des outils : staticcheck compile avec une
# chaine plus ancienne que l'app refuse de l'analyser (« module requires at least
# go1.25.0, but Staticcheck was built with go1.24.7 ») et rend un faux
# « ne compile pas ».
#
# Elle n'a rien a voir avec le « FROM golang:... » des Dockerfile, qui dit avec
# quoi on CONSTRUIT ce qu'on deploie. Celle-ci dit avec quoi on RELIT.
outil_toolchain: go1.26.7
outil_staticcheck: honnef.co/go/tools/cmd/staticcheck@2025.1.1
outil_gosec: github.com/securego/gosec/v2/cmd/gosec@v2.28.0
outil_govulncheck: golang.org/x/vuln/cmd/govulncheck@v1.7.0
outil_jscpd: jscpd@4.0.5

# Services partages par plusieurs applications. Ils vivent sur apps_net, sont
# joignables par leur nom depuis n'importe quelle app, et ne sont JAMAIS routes :
# init.sh leur pose « traefik.enable=false », le seul label qui RETIRE du
# routage — l'absence de label ne suffirait pas, exposedByDefault leur creerait
# un routeur sans authentification. Une app declare sa dependance avec
# « needs: [redis] » dans son app.yml, et un needs vers un service absent d'ici
# est une erreur de generation, pas une panne au demarrage.
#
# « command » s'ecrit en scalaire — decoupee sur les espaces — ou en LISTE, en
# ligne comme en bloc ; elle est lue et emise EN ENTIER dans les deux cas.
#
# Un secret ne se declare pas ici, et aucune syntaxe ne le fait passer : avant
# d'ecrire quoi que ce soit, init.sh scanne ce fichier, les apps/*/app.yml et le
# compose qu'il vient de produire. Une cle qui evoque un secret — requirepass,
# password, token, api-key, ou des identifiants dans une URL — suivie d'une
# VALEUR LITTERALE arrete la generation ; le message nomme le fichier et la
# ligne, sans jamais reimprimer la valeur. Le scan lit le RESULTAT et non les
# champs : « sh -c », health_cmd et command: y passent de la meme facon.
#
# Deux formes restent admises, et ce sont les deux bonnes :
#   « --requirepass ${REDIS_PASSWORD} »   le NOM va dans env:, la valeur est
#                                         injectee par l'infrastructure ;
#   « --password-file /run/secrets/pw »   un CHEMIN, forme du secret monte en
#                                         fichier cote serveur.
# Une option qui ne porte pas de secret passe telle quelle :
# « --notify-keyspace-events Ex », « --tls-key-file /certs/k.pem »,
# « --auth-host=trust ».
#
# Forme attendue pour un service qui aurait besoin d'un volume ou de secrets :
#
#   - name: directus
#     image: directus/directus:11
#     memory: 512m
#     env: [DIRECTUS_KEY, DIRECTUS_SECRET, ADMIN_EMAIL, ADMIN_PASSWORD]
#     volumes:
#       - base:/directus/database
#       - fichiers:/directus/uploads

shared_services:
  # Le cache de la fabrique. Un exemplaire pour toutes les apps : les cles sont
  # prefixees par l'app qui les ecrit, sans quoi deux applications ecrivant
  # « lignes » s'ecraseraient en silence.
  #
  # AUCUN volume, et trois reglages contre trois risques nommes :
  #   --save ""             ne rien ecrire sur un disque a 92 % pour une donnee
  #                         que l'app sait reconstruire en une lecture ;
  #   --maxmemory 64mb      un service sans borne grossit jusqu'a faire tomber
  #   --maxmemory-policy    la stack entiere, mem_limit ne faisant que le tuer ;
  #   allkeys-lru           l'eviction remplace la panne.
  #
  # Aucune authentification : redis n'est joignable que depuis apps_net, aucun
  # port n'est publie sur l'hote, et un mot de passe serait un nom de plus a
  # definir cote serveur — dont l'absence arriverait VIDE, donc en panne
  # silencieuse au demarrage de la stack entiere.
  - name: redis
    image: valkey/valkey:8-alpine
    memory: 96m
    command: ["valkey-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
