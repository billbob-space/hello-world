# Valeurs communes a toutes les applications de la fabrique.
# Modifie ce fichier puis relance ./init.sh.
org: billbob-space
repo: hello-world                 # entre dans le nom des images : ghcr.io/billbob-space/hello-world/<app>
registry: ghcr.io
domain: apps.billbob.ovh             # chaque app est servie sur <nom-app>.<domain>
network: apps_net           # reseau Docker existant cote serveur
entrypoint: websecure
cert_resolver: letsencrypt
security_headers: security-headers@file
memory_budget: 1024m   # plafond de la somme des mem_limit
image_max_mb: 200
log_max_size: 10m     # cap des journaux json-file, par service
log_max_file: 3

# Racine des points de montage cote hote. Un sous-repertoire par application :
# un volume « donnees:/var/lib/app » declare par l'app « ramure » est monte
# depuis /home/ubuntu/DockerConfig/My-Apps/ramure/donnees. Le cote hote
# n'est jamais ecrit dans un app.yml — c'est ce qui rend la traversee de
# repertoire impossible plutot que simplement interdite.
host_data_root: /home/ubuntu/DockerConfig/My-Apps

# Services partages par plusieurs applications. Ils vivent sur apps_net, sont
# joignables par leur nom depuis n'importe quelle app, et ne sont JAMAIS routes :
# aucun label Traefik, donc aucune URL. Une app declare sa dependance avec
# « needs: [redis] » dans son app.yml, et un needs vers un service absent d'ici
# est une erreur de generation, pas une panne au demarrage.
