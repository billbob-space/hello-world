# Genere par init.sh — construit l'image et la publie sur GHCR.
# Le serveur la recupere ensuite ; aucun secret de deploiement ici.
name: build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Sans buildx, le driver par defaut est 'docker', qui ne sait pas
      # exporter de cache : le cache-to gha plus bas ferait echouer la
      # construction avant meme de lire le Dockerfile.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/billbob-space/hello-world:main
            ghcr.io/billbob-space/hello-world:${{ github.sha }}
          # Identifie la version deployee ; le Dockerfile en fait ce qu'il veut,
          # l'ignorer est sans consequence.
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: taille de l'image
        run: |
          docker pull ghcr.io/billbob-space/hello-world:main
          size=$(docker image inspect ghcr.io/billbob-space/hello-world:main --format '{{.Size}}')
          echo "Image : $((size / 1024 / 1024)) Mo"
          if [ "$size" -gt 209715200 ]; then
            echo "::warning::image au-dela de 200 Mo — le serveur est a 92 % de disque"
          fi

      # Le tag :main est mutable : une image reconstruite ne change pas une
      # ligne du compose, donc l'auto-sync de dockhand ne voit aucun diff et ne
      # redeploie rien. C'est cet appel, apres publication, qui declenche le
      # deploiement — et il vient apres pour que le serveur tire bien la
      # nouvelle image, pas celle d'avant.
      #
      # L'URL est une URL de capacite : qui la connait declenche un
      # deploiement. Elle vit dans un secret du depot, jamais dans ce fichier.
      - name: declencher le deploiement
        env:
          WEBHOOK: ${{ secrets.DOCKHAND_DEPLOY_WEBHOOK }}
          WEBHOOK_SECRET: ${{ secrets.DOCKHAND_WEBHOOK_SECRET }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::secret DOCKHAND_DEPLOY_WEBHOOK absent — image publiee, deploiement NON declenche"
            exit 0
          fi

          # Corps d'un evenement push GitHub. Le depot y figure : un serveur
          # qui rattache le webhook a une stack verifie generalement que le
          # depot annonce est bien celui de la stack, et refuse sinon.
          branch=${GITHUB_REF#refs/heads/}
          repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          body=$(printf '{"ref":"%s","after":"%s","repository":{"full_name":"%s","name":"%s","html_url":"%s","clone_url":"%s.git","default_branch":"%s"}}' \
                   "$GITHUB_REF" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "${GITHUB_REPOSITORY#*/}" \
                   "$repo_url" "$repo_url" "$branch")
          echo "corps envoye : $body"

          # Deux conventions de signature coexistent chez les forges que
          # dockhand accepte : GitHub et Gitea signent le corps en HMAC-SHA256
          # (X-Hub-Signature-256), GitLab envoie le secret en clair
          # (X-Gitlab-Token). Les deux en-tetes partent ensemble ; le serveur
          # lit celui qu'il connait et ignore l'autre.
          set -- -H 'content-type: application/json' -H 'x-github-event: push' \
                 -H "x-github-delivery: $(cat /proc/sys/kernel/random/uuid)"
          if [ -n "$WEBHOOK_SECRET" ]; then
            sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | awk '{print $NF}')
            set -- "$@" -H "x-hub-signature-256: sha256=$sig" \
                        -H "x-gitlab-token: $WEBHOOK_SECRET"
          else
            echo "::warning::secret DOCKHAND_WEBHOOK_SECRET absent — appel non signe, le serveur le refusera s'il attend une signature"
          fi

          code=$(curl -sS -o reponse.txt -w '%{http_code}' --retry 3 --retry-delay 5 \
                   -X POST "$WEBHOOK" "$@" -d "$body")
          echo "reponse HTTP $code :"
          cat reponse.txt; echo
          if [ "$code" -ge 400 ]; then
            echo "::error::le webhook a refuse l'appel — image publiee, rien n'est deploye"
            exit 1
          fi
          echo "deploiement declenche"
