# Fichier ordinaire, edite directement. Aucune valeur de fabrique.yml n'y est
# figee : le job detect les relit a chaque run et les publie en sortie ; les
# jobs build et deploy les consomment via needs.detect.outputs.*. ./init.sh
# --check verifie que ce fichier existe, que son job contrat lance
# ./init.sh --check, et qu'aucune occurrence figee du registre, de l'org ou
# du depot ne s'y est glissee.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      toutes:
        description: reconstruire toutes les apps
        type: boolean
        default: false

# Une seule stack dockhand : deux deploiements concurrents se marcheraient
# dessus. Sur main on serialise donc SANS annuler — un deploiement engage doit
# finir, quitte a faire la queue.
#
# Sur une pull request il n'y a rien a proteger : aucun deploiement, aucune
# publication d'image, et le seul verdict qui compte est celui du DERNIER
# commit pousse. Laisser tourner les precedents faisait payer plusieurs fois la
# meme verification et retardait le verdict utile, puisque le groupe est
# serialise — le second run attendait la fin du premier au lieu de le remplacer.
concurrency:
  group: fabrique-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Le contrat devient un verrou de CI, et non plus un geste manuel : avec une
  # stack partagee, un compose faux fusionne casse toutes les apps a la fois.
  contrat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./init.sh --check

  # Le verrou verifie le depot ; celui-ci verifie le VERROU. init.sh etait le
  # seul programme du depot que rien ne testait, alors qu'un « ok » errone de sa
  # part laisse passer une faute dans toutes les apps a la fois. Job separe et
  # non etape du job contrat : chaque cas recopie le depot et relance --check.
  #
  # cout.sh a rejoint init.sh ici pour la raison inverse et symetrique : il ne
  # casse rien quand il se trompe, il MENT — un total faux ressemble trait pour
  # trait a un total juste, et le sien l'etait d'un facteur deux pendant huit
  # entrees de journal sans que rien ne l'attrape.
  #
  # C'EST LE JOB LE PLUS LONG DE LA CHAINE — 3 min 20 mesurees, dont 1 min 56
  # pour le seul test-init.sh, contre 10 s au job contrat. Deux choses le
  # tiennent desormais a l'ecart du chemin critique :
  #   - il ne tourne que si l'outillage a bouge (voir detect.outputs.outillage),
  #     ce qui l'ecarte de 16 fusions sur 20 mesurees sur main ;
  #   - test et build ne l'attendent plus. Il ne teste PAS les applications :
  #     rien de ce qu'il dit ne peut invalider une image. Seul deploy l'attend,
  #     et pour une raison precise : il valide init.sh --check, dont le job
  #     contrat n'est que l'execution. Mettre en ligne sur la foi d'un verrou
  #     dont on n'a pas verifie le mecanisme, c'est n'avoir aucun verrou.
  tests-de-l-outillage:
    needs: detect
    if: needs.detect.outputs.outillage == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./test-init.sh
      - run: ./test-cout.sh
      # pret.sh est le troisieme, et pour une troisieme raison : son garde-fou
      # « le PRD suit-il ? » est le seul de la fabrique a reposer sur une
      # heuristique. Trop bavarde on l'ignore, muette on ne la voit pas — les
      # deux derives passent la relecture, aucune ne passe ses huit cas.
      - run: ./test-pret.sh
      # jetons.sh est le quatrieme, et pour la meme raison que cout.sh : il rend
      # des nombres a sept chiffres qu'aucune relecture ne verifie a l'oeil. Sa
      # premiere version comptait trois cents lignes de PROSE comme des tours,
      # parce qu'une entree de journal qui cite un marqueur ouvrait le bloc que
      # ce marqueur delimite. La sortie restait plausible de bout en bout.
      - run: ./test-jetons.sh

  detect:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.choix.outputs.apps }}
      deploy: ${{ steps.choix.outputs.deploy }}
      compose: ${{ steps.choix.outputs.compose }}
      outillage: ${{ steps.choix.outputs.outillage }}
      registry: ${{ steps.fab.outputs.registry }}
      org: ${{ steps.fab.outputs.org }}
      repo: ${{ steps.fab.outputs.repo }}
      image_max_mb: ${{ steps.fab.outputs.image_max_mb }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Ces quatre valeurs vivaient recopiees dans ce fichier a la generation.
      # Les relire ici, a chaque run, c'est ce qui permet a ce fichier de ne
      # plus dependre d'un generateur : un changement dans fabrique.yml se voit
      # au prochain run, sans repasser par ./init.sh.
      - id: fab
        run: |
          set -euo pipefail
          val() { sed -nE "s/^$1:[[:space:]]*([^[:space:]#]+).*/\1/p" fabrique.yml; }
          echo "registry=$(val registry)"       >> "$GITHUB_OUTPUT"
          echo "org=$(val org)"                 >> "$GITHUB_OUTPUT"
          echo "repo=$(val repo)"                >> "$GITHUB_OUTPUT"
          echo "image_max_mb=$(val image_max_mb)" >> "$GITHUB_OUTPUT"
      - id: choix
        env:
          EVENT: ${{ github.event_name }}
          TOUTES: ${{ inputs.toutes }}
          AVANT: ${{ github.event.before }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          APRES: ${{ github.sha }}
        run: |
          set -euo pipefail
          # La liste complete des apps, activees ou non : la CI les teste et
          # les construit sans egard a enabled, qui ne pilote que le compose.
          # Calculee ici plutot que figee a la generation.
          liste_toutes=$(for d in apps/*/; do
                           a="${d%/}"; a="${a#apps/}"
                           [ -f "apps/$a/app.yml" ] && printf '%s\n' "$a"
                         done)
          toutes='[]'
          if [ -n "$liste_toutes" ]; then
            toutes="[$(printf '%s\n' "$liste_toutes" | sed 's/.*/"&"/' | paste -sd, -)]"
          fi

          if [ "$EVENT" = pull_request ]; then base="$BASE_PR"; else base="$AVANT"; fi

          # Une base absente du depot — premiere poussee d'une branche, greffe,
          # force-push — donnerait un diff vide. On reconstruit tout plutot que
          # de ne rien construire en silence.
          tout=0
          if [ "$EVENT" = workflow_dispatch ] && [ "$TOUTES" = true ]; then
            tout=1
          elif [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "base de comparaison indisponible ($base) — reconstruction complete"
            tout=1
          fi

          # compose : le fichier a-t-il change DANS CE QUI EST POUSSE, avant
          # tout epinglage. C'est ce qui distingue « il y a quelque chose a
          # redeployer » de « on a seulement construit une image ». Faux quand
          # on reconstruit tout : l'epinglage fera bouger le compose de lui-meme,
          # et c'est lui qui tranchera.
          compose=false
          if [ "$tout" = 1 ]; then
            apps="$toutes"; deploy=true; outillage=true
          else
            changed=$(git diff --name-only "$base" "$APRES")
            echo "fichiers modifies :"; printf '  %s\n' $changed

            # Les tests de l'outillage ne peuvent changer d'avis que si
            # l'outillage change — ils ne testent que lui. Deux exceptions, et
            # elles sont dans la liste : test-init.sh travaille dans une COPIE
            # du depot ou il casse apps/hello-world, apps/cadran et
            # apps/ramure-v2 pour verifier que --check les nomme. Un manifeste
            # ou un Dockerfile qui bouge peut donc deplacer son resultat ; le
            # CODE d'une application, jamais — il n'entre dans aucun de ses cas.
            if printf '%s\n' "$changed" \
                 | grep -qE '^(init\.sh|fabrique\.yml|lib/|scripts/|test-[^/]*\.sh|\.github/workflows/)|^apps/[^/]+/(app\.yml|Dockerfile)$'; then
              outillage=true
            else
              outillage=false
            fi

            if printf '%s\n' "$changed" | grep -qE '^(fabrique\.yml|\.github/workflows/)'; then
              # La recette de construction a bouge — le workflow lui-meme, ou
              # les valeurs qu'il relit a chaque run et qui composent les tags.
              # Plus rien ne garantit que les images publiees ont ete faites
              # avec la recette courante.
              #
              # init.sh N'EST PLUS dans cette liste, et c'est deliberé : le
              # contexte de construction est « apps/<app> » et rien d'autre, si
              # bien qu'AUCUN fichier hors de ce repertoire n'entre dans une
              # image. Le generateur ne peut donc pas en changer une seule. Ce
              # qu'il change, c'est compose.yaml — un artefact COMMITTE, qui
              # apparait donc de lui-meme dans ce diff et declenche plus bas le
              # redeploiement. Et si le generateur devient plus severe, c'est le
              # job contrat qui le rattrape : il relit le depot ENTIER a chaque
              # run, sans egard a cette liste. On reconstruisait les six images
              # a chaque retouche du generateur — 4 fusions sur 20 mesurees sur
              # main, dont une qui ne touchait aucune application.
              apps="$toutes"
            else
              # Un repertoire sous apps/ n'est une application que s'il porte un
              # app.yml : c'est la definition qu'applique discover_apps, et la
              # seule qui vaille. Un chemin ne suffit pas. Sans ce filtre, un
              # fichier depose sous apps/<nom>/ avant que l'application n'existe
              # — une specification, une note — fait reclamer a la CI le test.sh
              # et le Dockerfile d'une app qui n'est pas encore ecrite, et le
              # job echoue sur un repertoire de documentation.
              # Le filtre porte sur l'arbre APRES le commit : une app ajoutee
              # dans ce meme commit a deja son app.yml et reste donc detectee,
              # ce qui fait bien construire sa premiere image.
              # Un if, et non « [ -f ] && printf » : l'etape tourne sous set -e,
              # un test faux ferait sortir la boucle en code 1 et echouer le job.
              liste=$(printf '%s\n' "$changed" | sed -nE 's#^apps/([^/]+)/.*#\1#p' | LC_ALL=C sort -u \
                        | while IFS= read -r a; do
                            if [ -f "apps/$a/app.yml" ]; then printf '%s\n' "$a"; fi
                          done)
              if [ -n "$liste" ]; then
                apps="[$(printf '%s\n' "$liste" | sed 's/.*/"&"/' | paste -sd, -)]"
              else
                apps='[]'
              fi
            fi

            if printf '%s\n' "$changed" | grep -qx 'compose.yaml'; then compose=true; fi

            # Redeployer seulement si une image change ou si le compose change :
            # sinon un commit de documentation redemarrerait toute la stack.
            if [ "$apps" != '[]' ] || [ "$compose" = true ]; then
              deploy=true
            else
              deploy=false
            fi
          fi

          echo "apps=$apps"           >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy"       >> "$GITHUB_OUTPUT"
          echo "compose=$compose"     >> "$GITHUB_OUTPUT"
          echo "outillage=$outillage" >> "$GITHUB_OUTPUT"
          echo "-> apps : $apps   deploy : $deploy   compose : $compose   outillage : $outillage"

  # Une matrice vide fait echouer le job : d'ou le garde sur '[]'.
  test:
    needs: [contrat, detect]
    if: needs.detect.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      # Chaque app dit comment elle se teste dans un executable, comme elle dit
      # comment elle se construit dans un Dockerfile : la fabrique n'a pas a
      # connaitre les langages. Le runner fournit Go, Node, Python et Java ;
      # pour une autre chaine, testez dans un etage du Dockerfile.
      - name: tests de ${{ matrix.app }}
        run: ./apps/${{ matrix.app }}/test.sh

  build:
    needs: [contrat, detect, test]
    if: needs.detect.outputs.apps != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      # Sans buildx, le driver par defaut est 'docker', qui ne sait pas
      # exporter de cache : le cache-to gha plus bas ferait echouer la
      # construction avant meme de lire le Dockerfile.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ needs.detect.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # CONSTRUIRE D'ABORD EN LOCAL, PUBLIER ENSUITE. Entre les deux se glisse le
      # seul controle capable de voir les labels de l'IMAGE. Docker fusionne dans
      # les labels du conteneur ceux qui sont graves dans l'image — y compris
      # ceux HERITES d'une image de BASE ou poses par un etage intermediaire, que
      # la lecture de apps/<app>/Dockerfile faite par « ./init.sh --check » ne
      # peut pas voir. Un « traefik.* » grave la publierait un routeur
      # SUPPLEMENTAIRE : il porte un autre nom que celui de compose.yaml, donc le
      # compose ne l'ecrase pas, et il arrive SANS middleware d'authentification —
      # constate avec Traefik 3.7.10. Le service principal, lui, est route :
      # traefik.enable=false ne le couvre pas, ce controle est sa seule parade.
      # L'etape de publication ci-dessous repart de ce cache : rien n'est
      # reconstruit, et surtout pas une image differente de celle qu'on inspecte.
      - name: construire ${{ matrix.app }} sans publier
        uses: docker/build-push-action@v6
        with:
          # Contexte reduit a l'app : c'est ce qui isole les constructions les
          # unes des autres et empeche une edition dans une app d'invalider le
          # cache de couches des autres.
          context: apps/${{ matrix.app }}
          file: apps/${{ matrix.app }}/Dockerfile
          # Sur une pull request on construit sans publier : la validation du
          # Dockerfile ne doit pas bouger le tag :main que le serveur suit.
          push: ${{ github.event_name != 'pull_request' }}
          # ... mais l'image doit alors entrer dans le demon local, sinon
          # l'etape suivante n'a rien a inspecter sur une pull request : sans
          # publication, l'image reste dans le cache de buildx, invisible a
          # « docker image inspect ». push et load s'excluent — jamais vrais
          # ensemble ici, c'est la meme condition inversee.
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ needs.detect.outputs.registry }}/${{ needs.detect.outputs.org }}/${{ needs.detect.outputs.repo }}/${{ matrix.app }}:main
            ${{ needs.detect.outputs.registry }}/${{ needs.detect.outputs.org }}/${{ needs.detect.outputs.repo }}/${{ matrix.app }}:${{ github.sha }}
          # Rattache le paquet au depot : ses permissions suivent alors celles
          # du depot, et un seul identifiant de lecture couvre toutes les apps.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ needs.detect.outputs.org }}/${{ needs.detect.outputs.repo }}
          # Identifie la version deployee ; le Dockerfile en fait ce qu'il veut,
          # l'ignorer est sans consequence.
          build-args: |
            VERSION=${{ github.sha }}
          # Le scope est obligatoire en matrice : sans lui les constructions
          # paralleles se disputent un cache unique et s'evincent l'une l'autre.
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      # Deux controles sur l'image finie, la seule chose que le serveur tirera.
      # Sur une pull request elle vient de « load », sur main du registre.
      - name: labels et taille de l'image
        run: |
          set -euo pipefail
          image=${{ needs.detect.outputs.registry }}/${{ needs.detect.outputs.org }}/${{ needs.detect.outputs.repo }}/${{ matrix.app }}:main
          if [ "${{ github.event_name }}" != pull_request ]; then
            docker pull "$image"
          fi

          # Le contrat interdit tout LABEL traefik.* dans un Dockerfile, et
          # --check le verifie. Mais il lit le Dockerfile, ou un label HERITE
          # d'une image de base n'apparait pas. Docker fusionne pourtant les
          # labels de l'image dans ceux du conteneur : le routeur ainsi publie
          # porte un autre nom que celui du compose, donc le compose ne peut
          # pas l'ecraser — il vivrait SANS middleware d'authentification.
          # L'image construite est le seul endroit ou un label herite se voit.
          # L'inspection est isolee du filtre, et c'est tout l'interet : dans
          # « inspect | grep ... || true », le « || true » couvre le PIPELINE
          # ENTIER. Une inspection en echec — image absente, tag mal forme,
          # demon indisponible — rendait alors une liste vide, indiscernable
          # d'une image saine, et le garde-fou annoncait « aucun label » en
          # sortant en succes. Un controle de securite qui echoue en ouvert est
          # pire que pas de controle : il rassure. Ici l'affectation echoue sous
          # « set -e » et l'etape s'arrete ; le « || true » ne couvre plus que
          # grep, dont le code 1 signifie « aucune correspondance », seul cas
          # ou l'absence de resultat est une bonne nouvelle.
          labels=$(docker image inspect "$image" \
                     --format '{{range $k, $v := .Config.Labels}}{{println $k}}{{end}}')
          graves=$(printf '%s\n' "$labels" | grep -iE '^traefik\.' || true)
          if [ -n "$graves" ]; then
            printf '::error::LABEL traefik grave dans l image ${{ matrix.app }} : %s\n' $graves
            echo "::error::Docker le fusionnerait dans les labels du conteneur et publierait un routeur SUPPLEMENTAIRE, sans authentification. Retire-le du Dockerfile, ou change d image de base : ce label n est pas ecrasable depuis le compose."
            exit 1
          fi
          echo "aucun label traefik.* — ni ecrit dans le Dockerfile, ni herite de l image de base"

          size=$(docker image inspect "$image" --format '{{.Size}}')
          echo "Image ${{ matrix.app }} : $((size / 1024 / 1024)) Mo"
          if [ "$size" -gt $(( ${{ needs.detect.outputs.image_max_mb }} * 1024 * 1024 )) ]; then
            echo "::warning::image au-dela de ${{ needs.detect.outputs.image_max_mb }} Mo — le serveur est a 92 % de disque"
          fi

  deploy:
    needs: [contrat, tests-de-l-outillage, detect, test, build]
    # « sauté » et « échoué » doivent se distinguer : un build saute (rien a
    # reconstruire, mais le compose a change) doit laisser passer, un build en
    # echec doit bloquer. Sinon un commit a moitie construit referencerait une
    # image inexistante et emporterait les apps saines.
    #
    # Et il faut le dire de CHAQUE job attendu, un par un : « always() » desarme
    # le blocage implicite de « needs », si bien qu'un job absent de cette liste
    # peut echouer sans rien empecher. C'etait le cas de tests-de-l-outillage —
    # present dans « needs », nulle part ici : la mise en ligne partait meme
    # quand la preuve du verrou tombait. La ligne ci-dessous ferme ce trou en
    # meme temps qu'elle admet le saut, desormais le cas courant.
    # Ecriture entre crochets : un trait d'union est un signe de soustraction
    # dans une expression, « needs.tests-de-l-outillage » ne se lit pas.
    #
    # workflow_dispatch est admis a cote de push, et c'est ce qui rend l'entree
    # « toutes » utilisable. Elle promettait de tout reconstruire ; elle le
    # faisait — detect rend bien la liste complete et build publie les images —
    # mais ce job-ci s'arretait sur « event_name == push », si bien que rien
    # n'etait EPINGLE ni DEPLOYE : les images partaient au registre, versions.yml
    # gardait les anciens commits, et le compose que dockhand relit ne bougeait
    # pas d'une ligne. Le seul levier de rattrapage de la fabrique — celui qu'on
    # actionne quand la CI a rate des fusions, comme le 16 aout — s'arretait a
    # mi-chemin en annoncant un succes. La garde qui compte est celle de la
    # ligne suivante, « ref == refs/heads/main » : elle vaut pour les deux
    # evenements, et un dispatch sur une autre branche ne deploie pas davantage
    # qu'une poussee sur une autre branche.
    if: >-
      always()
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
      && needs.detect.outputs.deploy == 'true'
      && needs.contrat.result == 'success'
      && needs.detect.result == 'success'
      && (needs['tests-de-l-outillage'].result == 'success' || needs['tests-de-l-outillage'].result == 'skipped')
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    # contents: write — ce job ECRIT sur main : il y enregistre la version de
    # chaque image qu'il vient de publier. C'est la seule ecriture de toute la
    # chaine, et elle ne porte que sur deux fichiers derives du build.
    permissions:
      contents: write
      packages: read
    steps:
      # Historique complet : ce job peut avoir a se rebaser sur main avant de
      # pousser, ce qu'un clone superficiel ne sait pas faire.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ needs.detect.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # LE PAS QUI REND LE DEPLOIEMENT SELECTIF.
      #
      # Le tag d'image etait « :main » pour toutes les apps, et il est mutable :
      # une image reconstruite ne changeait pas une ligne du compose. dockhand,
      # qui ne redeploie que sur un diff, ne voyait donc jamais rien passer — on
      # ne s'en sortait qu'avec « Force redeployment », c'est-a-dire en recreant
      # les NEUF conteneurs de la stack pour livrer une seule app.
      #
      # Ici, chaque app construite recoit le commit qui l'a construite comme tag.
      # Le compose porte alors une ligne image: differente pour la seule app
      # livree : « docker compose up » recree ce service-la et laisse les autres
      # conteneurs intacts. Le rayon de souffle d'une livraison tombe a l'app
      # qu'on livre — et le depot dit desormais quelle version tourne en ligne.
      - name: epingler la version des images construites
        id: pin
        if: needs.detect.outputs.apps != '[]'
        env:
          APPS: ${{ needs.detect.outputs.apps }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          pins=()
          for a in $(printf '%s' "$APPS" | tr -d '[]"' | tr ',' ' '); do
            pins+=(--pin "$a=$SHA")
          done
          ./init.sh "${pins[@]}" >/dev/null
          git --no-pager diff --stat
          # Une app construite mais desactivee n'a pas de bloc dans le compose :
          # sa version s'enregistre, mais il n'y a rien a redeployer. Distinguer
          # les deux ici evite d'appeler le webhook pour rien — et d'echouer sur
          # le « skipped » que dockhand renverrait alors a juste titre.
          if git diff --quiet -- compose.yaml; then
            echo "compose=false" >> "$GITHUB_OUTPUT"
            echo "aucun service du compose ne change — rien a redeployer"
          else
            echo "compose=true" >> "$GITHUB_OUTPUT"
          fi

      # Garde-fou propre a la stack unique : « docker compose up » est atomique
      # pour la stack entiere. Une seule image absente du registre le fait
      # echouer et emporte les applications saines. On verifie donc chaque
      # reference du compose AVANT d'appeler le webhook — le pire cas devient
      # « rien n'est deploye » au lieu de « tout tombe ».
      - name: toutes les images du compose sont tirables
        run: |
          set -euo pipefail
          # sort -u : la meme image peut etre referencee par plusieurs services
          # — une app et son worker partagent la leur — et l'inspecter deux fois
          # ne prouve rien de plus.
          mapfile -t images < <(sed -nE 's/^[[:space:]]*image:[[:space:]]*(.*)$/\1/p' compose.yaml | LC_ALL=C sort -u)
          if [ ${#images[@]} -eq 0 ]; then
            echo "::error::aucune image dans compose.yaml — la stack ne deploierait rien"
            exit 1
          fi
          # TOUTES les images sont verifiees, les TIERCES COMPRISES, et un echec
          # bloque. « docker buildx imagetools inspect » interroge le registre en
          # ANONYME quand il n'a pas d'identifiants, et l'inspection d'une image
          # publique aboutit sans login — mesure, docker deconnecte de tout
          # registre : l'inspection de valkey/valkey:8-alpine sort en 0, la meme
          # avec une faute de frappe sort en 1. Une image tierce mal
          # orthographiee ou disparue ferait echouer le « docker compose up »,
          # atomique pour la stack entiere : la laisser passer, c'est deployer
          # une fabrique qui tombe TOUTE. Une image tierce reellement privee est
          # le seul faux positif possible, et elle n'aurait de toute facon pas sa
          # place dans un compose que le serveur tire sans identifiants.
          manquantes=()
          for img in "${images[@]}"; do
            if docker buildx imagetools inspect "$img" >/dev/null 2>&1; then
              echo "  ok   $img"
            else
              echo "  KO   $img"
              manquantes+=("$img")
            fi
          done
          if [ ${#manquantes[@]} -gt 0 ]; then
            printf '::error::image introuvable dans son registre : %s\n' "${manquantes[@]}"
            echo "::error::deploiement refuse — il ferait tomber toutes les apps de la stack"
            exit 1
          fi
          echo "${#images[@]} image(s) distincte(s) verifiee(s)"

      # Les versions epinglees n'ont d'effet que committees : c'est le depot que
      # dockhand relit, pas ce runner. On pousse APRES le controle ci-dessus et
      # AVANT le webhook — dans cet ordre exactement. Apres, parce qu'un tag
      # pointant vers une image absente resterait sinon sur main et ferait
      # echouer tous les deploiements suivants ; avant, parce que dockhand clone
      # le depot au moment ou on l'appelle.
      #
      # Le pousseur est la CLE DE DEPLOIEMENT, pas le GITHUB_TOKEN : une regle
      # de protection de main exige des controles de statut sur tout ce qui y
      # est pousse, et le commit d'epinglage porte « [skip ci] » — les controles
      # exiges ne tourneront donc jamais sur lui, et la regle le refuserait
      # toujours. Seule une cle de deploiement inscrite dans la Bypass list de
      # la regle peut l'ecrire ; le robot des Actions, lui, ne s'y inscrit pas
      # (GitHub ne le propose pas dans cette liste).
      #
      # Consequence a ne pas perdre de vue : contrairement au GITHUB_TOKEN, une
      # poussee faite par une cle de deploiement DECLENCHE les workflows. Ce qui
      # ferme la boucle « la CI committe, donc la CI repart », c'est donc
      # desormais le « [skip ci] » du message, et lui seul. Ne le retire pas.
      - name: enregistrer les versions deployees
        if: steps.pin.outputs.compose != ''
        env:
          APPS: ${{ needs.detect.outputs.apps }}
          SHA: ${{ github.sha }}
          CLE: ${{ secrets.DEPLOIEMENT_SSH_KEY }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # On indexe AVANT de juger : au tout premier epinglage, versions.yml
          # n'est pas encore suivi par git, et « git diff » ne voit pas un
          # fichier non suivi — la version aurait ete perdue sans un mot.
          git add versions.yml compose.yaml
          if git diff --cached --quiet; then
            echo "versions inchangees — rien a enregistrer"
            exit 0
          fi
          liste=$(printf '%s' "$APPS" | tr -d '[]"' | tr ',' ' ')
          git commit -q -m "deploiement : $liste sur ${SHA:0:7} [skip ci]" \
                        -m "Version epinglee par la CI. Le compose ne change que pour ces apps ; les autres conteneurs de la stack ne sont pas recrees."
          # La cle absente, on pousse comme avant, en HTTPS avec le GITHUB_TOKEN :
          # le depot reste utilisable tel quel — un fork, une copie, un depot ou
          # main n'est pas protege n'ont rien a configurer. La regle de
          # protection, elle, refusera cette poussee, et l'erreur en fin d'etape
          # dit alors exactement quoi poser.
          if [ -n "${CLE:-}" ]; then
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            # Une cle privee collee dans un secret perd souvent sa forme : des
            # retours chariot Windows, ou un corps replie sur UNE seule ligne
            # par un presse-papier — un telephone le fait sans prevenir. openssh
            # refuse alors la cle avec « error in libcrypto », message qui ne
            # dit ni quoi ni ou, puis git accuse les droits d'acces. On la
            # remet en forme avant de s'en servir. Le script est ecrit sans
            # indentation propre (sed la retire) : un bloc YAML impose une marge
            # que Python refuserait.
            sed 's/^[[:space:]]*//' <<'NORMALISER' > "$RUNNER_TEMP/normaliser.py"
            import os, re, sys
            brut = os.environ["CLE"].replace("\r", "").strip()
            m = re.match(r"^(-----BEGIN [A-Z0-9 ]+-----)(.*?)(-----END [A-Z0-9 ]+-----)$", brut, re.S)
            if not m: sys.exit("ni en-tete ni pied de cle privee reconnus")
            debut, corps, fin = m.group(1), m.group(2).strip(), m.group(3)
            nu = re.sub(r"\s+", "", corps)
            corps = corps if "\n" in corps else "\n".join(nu[i:i + 70] for i in range(0, len(nu), 70))
            sys.stdout.write(debut + "\n" + corps + "\n" + fin + "\n")
            NORMALISER
            if ! CLE="$CLE" python3 "$RUNNER_TEMP/normaliser.py" > ~/.ssh/deploiement; then
              echo "::error::secret DEPLOIEMENT_SSH_KEY illisible — recopie la cle privee ENTIERE, de la ligne BEGIN a la ligne END incluses"
              exit 1
            fi
            chmod 600 ~/.ssh/deploiement
            # Verifier la cle AVANT de pousser : sinon son defaut se lit dans un
            # « Permission denied (publickey) », qui accuse les droits alors que
            # le probleme est la forme du secret. Seule l'empreinte publique est
            # affichee — elle se compare a celle listee dans Deploy keys.
            if ! ssh-keygen -y -f ~/.ssh/deploiement > /dev/null 2>&1; then
              echo "::error::secret DEPLOIEMENT_SSH_KEY : cle refusee par openssh apres remise en forme — regenere la paire et recolle-la"
              exit 1
            fi
            echo "cle de deploiement chargee — empreinte $(ssh-keygen -l -f ~/.ssh/deploiement | cut -d' ' -f2)"
            # La cle d'hote est epinglee par ssh-keyscan plutot que par
            # StrictHostKeyChecking=no : accepter n'importe quel hote sur un
            # runner jetable n'aurait rien verifie du tout.
            ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploiement -o IdentitiesOnly=yes"
            git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          else
            echo "::warning::secret DEPLOIEMENT_SSH_KEY absent — poussee en HTTPS, refusee si main est protege par des controles de statut"
          fi

          # Une poussee peut echouer parce qu'un humain a pousse entre-temps :
          # on se rebase et on retente, sans jamais forcer.
          for essai in 1 2 3 4; do
            if git push origin "HEAD:main"; then exit 0; fi
            echo "poussee refusee — tentative $essai"
            sleep $(( 2 ** essai ))
            git fetch origin main
            git rebase FETCH_HEAD
          done
          echo "::error::impossible d'enregistrer les versions sur main — rien n'est deploye"
          echo "::error::si le refus est « repository rule violations », la cle de deploiement (secret DEPLOIEMENT_SSH_KEY, avec acces en ecriture) doit figurer dans la Bypass list de la regle qui protege main"
          exit 1

      # L'appel vient APRES la publication des images et APRES la poussee des
      # versions : dockhand clone le depot lui-meme et tire les images qu'il y
      # lit. Dans l'autre ordre, il deploierait l'etat d'avant.
      #
      # Il y a desormais un vrai diff a voir — la ligne image: de l'app livree —
      # ce qui rend « Force redeployment » INUTILE, et meme nuisible : force,
      # dockhand recree les neuf conteneurs de la stack ; sans force, il ne
      # recree que les services dont le compose a bouge. Le reglage doit rester
      # DECOCHE cote serveur, dans les Deploy options de la stack.
      #
      # L'URL est une URL de capacite : qui la connait declenche un
      # deploiement. Elle vit dans un secret du depot, jamais dans ce fichier.
      - name: declencher le deploiement
        env:
          WEBHOOK: ${{ secrets.DOCKHAND_DEPLOY_WEBHOOK }}
          WEBHOOK_SECRET: ${{ secrets.DOCKHAND_WEBHOOK_SECRET }}
          PIN_COMPOSE: ${{ steps.pin.outputs.compose }}
          PUSH_COMPOSE: ${{ needs.detect.outputs.compose }}
        run: |
          # Aucun service du compose ne change : il n'y a rien a redeployer, et
          # appeler quand meme reveillerait la stack entiere pour rien. Le cas
          # existe — une app construite mais encore desactivee, premier des deux
          # commits d'un ajout.
          if [ "$PIN_COMPOSE" != true ] && [ "$PUSH_COMPOSE" != true ]; then
            echo "compose.yaml inchange — images publiees, aucun conteneur a recreer"
            exit 0
          fi

          if [ -z "$WEBHOOK" ]; then
            echo "::warning::secret DOCKHAND_DEPLOY_WEBHOOK absent — images publiees, deploiement NON declenche"
            exit 0
          fi

          # Un secret colle porte souvent un retour a la ligne invisible. Il
          # casserait la signature comme le jeton, pour un 403 indistinguable
          # d'un mauvais secret.
          secret=$(printf '%s' "$WEBHOOK_SECRET" | tr -d '\r\n')

          # Recette documentee par dockhand pour une CI generique : POST d'un
          # corps quelconque, signe en HMAC-SHA256. Le corps ne sert pas au
          # serveur, qui relit le depot lui-meme ; seule la signature compte.
          payload='{}'
          if [ -n "$secret" ]; then
            sig=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$secret" | awk '{print $NF}')
            set -- -H "x-hub-signature-256: sha256=$sig"
          else
            echo "::warning::secret DOCKHAND_WEBHOOK_SECRET absent — appel non signe, il sera refuse"
            set --
          fi

          code=$(curl -sS -o reponse.txt -w '%{http_code}' --retry 3 --retry-delay 5 \
                   -X POST "$WEBHOOK" -H 'content-type: application/json' "$@" -d "$payload")
          echo "reponse HTTP $code :"
          cat reponse.txt; echo

          if [ "$code" = 403 ]; then
            echo "::error::403 — le secret envoye ne correspond pas a celui configure sur la stack dockhand"
            exit 1
          fi
          if [ "$code" -ge 400 ]; then
            echo "::error::le webhook a refuse l'appel — images publiees, rien n'est deploye"
            exit 1
          fi

          # Un 200 ne veut PAS dire deploye. dockhand rend « success: false » et
          # met la cause dans « error », sans changer le code HTTP. Constate le
          # 6 aout 2026 : le conteneur dockhand ne resolvait plus github.com,
          # son clone du depot echouait, le job « deploy » etait vert, et
          # l'echec ne s'est vu qu'a l'oeil une heure plus tard sur l'URL de
          # l'app. Ce test-la vient en premier : il couvre toutes les causes de
          # refus, la ou celui du dessous n'en couvre qu'une.
          if grep -q '"success":[[:space:]]*false' reponse.txt; then
            echo "::error::dockhand a refuse le deploiement — la cause est dans le champ « error » de la reponse ci-dessus. Les images sont publiees, RIEN n'est deploye."
            exit 1
          fi

          # dockhand ne redeploie que s'il voit un commit nouveau, et repond 200
          # quand il saute : sans ce test, la CI serait verte et le serveur
          # servirait toujours les images d'avant. On n'arrive ici qu'avec un
          # compose.yaml qui a bel et bien change et ete pousse — un saut ne
          # peut donc plus vouloir dire « rien a faire », il veut dire que
          # dockhand n'a pas vu la poussee.
          if grep -q '"skipped":[[:space:]]*true' reponse.txt; then
            echo "::error::dockhand a saute le deploiement alors que compose.yaml a change sur main."
            echo "::error::Il n'a pas vu la poussee : verifie que la stack suit bien la branche main de ce depot, et que son clone n'est pas bloque (le conteneur dockhand doit resoudre github.com)."
            exit 1
          fi
          echo "deploiement declenche"
