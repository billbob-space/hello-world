# Fichier ordinaire, edite directement. Aucune valeur de fabrique.yml n'y est
# figee : le job detect les relit a chaque run et les publie en sortie ; les
# jobs build et deploy les consomment via needs.detect.outputs.*. ./init.sh
# --check verifie que ce fichier existe, que son job contrat lance
# ./init.sh --check, et qu'aucune occurrence figee du registre, de l'org ou
# du depot ne s'y est glissee.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      toutes:
        description: reconstruire toutes les apps
        type: boolean
        default: false

# Une seule stack dockhand : deux deploiements concurrents se marcheraient
# dessus. Sur main on serialise donc SANS annuler — un deploiement engage doit
# finir, quitte a faire la queue.
#
# Sur une pull request il n'y a rien a proteger : aucun deploiement, aucune
# publication d'image, et le seul verdict qui compte est celui du DERNIER
# commit pousse. Laisser tourner les precedents faisait payer plusieurs fois la
# meme verification et retardait le verdict utile, puisque le groupe est
# serialise — le second run attendait la fin du premier au lieu de le remplacer.
concurrency:
  group: fabrique-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Le contrat devient un verrou de CI, et non plus un geste manuel : avec une
  # stack partagee, un compose faux fusionne casse toutes les apps a la fois.
  contrat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 — l'historique complet, pour que l'etape « relecteurs »
      # ci-dessous puisse comparer la branche a sa base. Un clone superficiel
      # rendrait « origin/main...HEAD » vide, et le controle passerait au vert
      # en n'ayant rien compare.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ./init.sh --check

      # LES DEUX RELECTEURS, verifies sur les pull requests SEULEMENT. Ils ne
      # sont pas mecanisables — un agent lit du code et regarde des ecrans — mais
      # leur TRACE l'est : le corps de la PR pour la relecture de code, un
      # fichier date pour la critique UX. On ne verifie pas qu'ils ont eu raison,
      # on verifie qu'ils ont eu lieu.
      #
      # Sur une pull request seulement, et c'est deliberé : la relecture vient en
      # FIN de branche. L'exiger a chaque commit ferait echouer le premier de
      # chaque branche, ce qui apprend a contourner.
      - name: les deux relecteurs ont-ils eu lieu
        if: github.event_name == 'pull_request'
        env:
          CORPS: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          echec=0

          # 1. La relecture de code : une ligne remplie sous « ## Revue ».
          #    Le gabarit sort avec « AAAA-MM-JJ » en clair ; le laisser tel quel
          #    est le contournement evident, donc c'est celui qu'on ferme.
          if ! printf '%s' "$CORPS" | grep -q '^## Revue'; then
            echo "::error::le corps de la pull request n'a pas de section « ## Revue ». Le gabarit .github/pull_request_template.md la porte : remplis-la."
            echec=1
          elif printf '%s' "$CORPS" | grep -qE '^\- \*\*Code\*\*.*AAAA-MM-JJ'; then
            echo "::error::la ligne « Code » de la section « ## Revue » est restee au gabarit. Lance l agent relecteur sur la branche et ecris ce qu il a trouve."
            echec=1
          elif ! printf '%s' "$CORPS" | grep -qE '^\- \*\*Code\*\* .*[0-9]{4}-[0-9]{2}-[0-9]{2}.*[A-Za-z]'; then
            echo "::error::la ligne « Code » de la section « ## Revue » est vide ou sans date. Forme attendue : « - **Code** — relecteur, le 2026-08-20 : <ce qu il a trouve> »."
            echec=1
          else
            echo "  ok    relecture de code consignee"
          fi

          # 2. La critique UX : un fichier DATE, plus recent que le dernier
          #    changement d ecran de l app. C est le seul des deux qui se mesure
          #    vraiment, parce qu il laisse un artefact dans le depot.
          #
          #    Seules les apps dont la BRANCHE touche les ecrans sont concernees.
          #    Decision de l utilisateur : les sept apps qui n ont jamais eu de
          #    critique ne sont pas rattrapees, seulement ce qui bouge desormais.
          base=$(git merge-base origin/${{ github.event.pull_request.base.ref }} HEAD)
          # Meme liste d'exclusion que scripts/pret.sh : « web/ » en entier
          # attraperait aussi configurations, tests et documentation, et un
          # garde-fou qui crie sur un fichier de doc apprend a etre ignore.
          for app in $(git diff --name-only "$base" HEAD \
                        | grep -vE '\.md$|(^|/)tests?/|\.config\.[jt]s$|(^|/)package(-lock)?\.json$|(^|/)tsconfig[^/]*\.json$' \
                        | sed -nE 's#^apps/([^/]+)/(web/|page\.html|.*\.html|.*\.css).*#\1#p' \
                        | sort -u); do
            [ -f "apps/$app/app.yml" ] || continue
            ecran=$(git log -1 --format=%ct "$base..HEAD" -- \
                      "apps/$app/web" "apps/$app/page.html" "apps/$app"/*.html "apps/$app"/*.css 2>/dev/null || true)
            [ -n "$ecran" ] || continue
            critique=$(ls -1 "apps/$app/.impeccable/critique/" 2>/dev/null | sort | tail -1 || true)
            if [ -z "$critique" ]; then
              echo "::error::les ecrans de $app ont bouge et aucune critique UX n existe. Lance l agent esthete sur cette app."
              echec=1; continue
            fi
            # L horodatage est DANS le nom du fichier — 2026-08-03T11-52-25Z__… —
            # et non dans sa date de modification : un clone git remet toutes les
            # mtime a l heure du clone, et le controle passerait toujours.
            iso=$(printf '%s' "$critique" | sed -nE 's/^([0-9]{4}-[0-9]{2}-[0-9]{2})T([0-9]{2})-([0-9]{2})-([0-9]{2})Z.*/\1 \2:\3:\4 UTC/p')
            if [ -z "$iso" ]; then
              echo "::error::la critique la plus recente de $app ($critique) n a pas un nom horodate — impossible de juger sa fraicheur."
              echec=1; continue
            fi
            quand=$(date -u -d "$iso" +%s)
            if [ "$quand" -lt "$ecran" ]; then
              echo "::error::les ecrans de $app ont bouge APRES sa derniere critique UX ($critique). Relance l agent esthete."
              echec=1
            else
              echo "  ok    critique UX de $app a jour ($critique)"
            fi
          done

          [ "$echec" = 0 ] || exit 1

  # Le verrou verifie le depot ; celui-ci verifie le VERROU. init.sh etait le
  # seul programme du depot que rien ne testait, alors qu'un « ok » errone de sa
  # part laisse passer une faute dans toutes les apps a la fois. Job separe et
  # non etape du job contrat : chaque cas recopie le depot et relance --check.
  #
  # cout.sh a rejoint init.sh ici pour la raison inverse et symetrique : il ne
  # casse rien quand il se trompe, il MENT — un total faux ressemble trait pour
  # trait a un total juste, et le sien l'etait d'un facteur deux pendant huit
  # entrees de journal sans que rien ne l'attrape.
  #
  # C'ETAIT LE CHEMIN CRITIQUE DE TOUTE LA CHAINE — 8 min 12 mesurees sur le run
  # 32162296876, quand tout le reste etait pret a 2 min 15. Les quatre scripts y
  # etaient joues EN SEQUENCE alors qu'ils sont independants : chacun recopie le
  # depot dans son propre repertoire temporaire et ne lit rien de ce qu'un autre
  # ecrit. En matrice, le job vaut desormais son script le plus long au lieu de
  # leur somme.
  #
  # Trois choses le tiennent a l'ecart du chemin critique :
  #   - il ne tourne que si l'outillage a bouge (voir detect.outputs.outillage),
  #     ce qui l'ecarte de 16 fusions sur 20 mesurees sur main ;
  #   - test et build ne l'attendent plus. Il ne teste PAS les applications :
  #     rien de ce qu'il dit ne peut invalider une image. Seul deploy l'attend,
  #     et pour une raison precise : il valide init.sh --check, dont le job
  #     contrat n'est que l'execution. Mettre en ligne sur la foi d'un verrou
  #     dont on n'a pas verifie le mecanisme, c'est n'avoir aucun verrou ;
  #   - ses quatre scripts tournent en parallele.
  #
  # fail-fast: false — on veut les quatre verdicts, pas le premier. Une shard
  # annulee rendrait le job rouge et bloquerait deploy de toute facon, mais sans
  # dire ce qui va mal ailleurs.
  outillage:
    needs: detect
    if: needs.detect.outputs.outillage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # test-init.sh   : le plus long des quatre, et le seul que deploy attende
        #                  legitimement — voir plus haut.
        # test-cout.sh   : cout.sh ne casse rien quand il se trompe, il ment.
        # test-pret.sh   : son garde-fou « le PRD suit-il ? » est le seul de la
        #                  fabrique a reposer sur une heuristique. Trop bavarde
        #                  on l'ignore, muette on ne la voit pas — les deux
        #                  derives passent la relecture, aucune ne passe ses huit
        #                  cas.
        # test-jetons.sh : meme raison que cout.sh — des nombres a sept chiffres
        #                  qu'aucune relecture ne verifie a l'oeil. Sa premiere
        #                  version comptait trois cents lignes de PROSE comme des
        #                  tours, parce qu'une entree de journal qui cite un
        #                  marqueur ouvrait le bloc que ce marqueur delimite. La
        #                  sortie restait plausible de bout en bout.
        # test-revue.sh  : revue.sh est la seule piece de la fabrique qui puisse
        #                  echouer EN OUVERT — rendre vert en n'ayant rien
        #                  verifie. Un tel defaut ne se voit ni dans un diff ni
        #                  dans la sortie, et rassure. Constate deux fois pendant
        #                  son ecriture : jscpd ecarte en silence les formats
        #                  qu'il ne connait pas, puis les fichiers de plus de
        #                  mille lignes — deux fois un rapport bien forme sur un
        #                  perimetre vide.
        script: [test-init.sh, test-cout.sh, test-pret.sh, test-jetons.sh, test-revue.sh]
    steps:
      - uses: actions/checkout@v4
      - run: ./${{ matrix.script }}

  # Un seul nom de controle pour les quatre shards. La matrice ci-dessus publie
  # « outillage (test-init.sh) » et trois freres, dont les noms changeraient a
  # chaque fois qu'on redecoupe ; la regle qui protege main, elle, exige des
  # controles de statut nommes. Ce job garde donc le nom historique, stable quoi
  # qu'il arrive a la matrice.
  #
  # if: !cancelled() — et non « always() ». Sans condition du tout, une shard
  # rouge rendrait CE job « skipped », et un controle requis qui ne se prononce
  # pas bloque la PR au lieu de la refuser : il doit donc se prononcer meme quand
  # la matrice echoue. Mais « always() » le fait se prononcer une fois de trop —
  # sur un run ANNULE, ou il lisait « cancelled », tombait dans sa branche par
  # defaut et affichait un rouge qui ne dit rien d'autre qu'« une poussee plus
  # recente a pris la place ». Vu des le premier essai : deux commits a une
  # minute d'intervalle, et une PR ornee d'un echec imaginaire.
  #
  # « detect » figure dans les needs, et pas seulement « outillage ». Sans lui,
  # ce job lisait « skipped » et disait « rien n'a bouge » — or GitHub rapporte
  # AUSSI « skipped » quand la matrice a ete sautee parce que le job dont elle
  # depend a ECHOUE. Un controle requis passait donc au vert sur un run qui
  # n'avait rien verifie, et qui ne pouvait pas savoir s'il aurait du. « Saute »
  # ne veut dire « rien a faire » que si celui qui l'a decide a lui-meme abouti.
  tests-de-l-outillage:
    needs: [detect, outillage]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: verdict de la matrice outillage
        run: |
          amont='${{ needs.detect.result }}'
          resultat='${{ needs.outillage.result }}'
          if [ "$amont" != success ]; then
            echo "  KO    detect : $amont — la matrice a ete sautee faute d'avoir su quoi lancer"
            exit 1
          fi
          case "$resultat" in
            success) echo "  ok    outillage : les cinq scripts sont verts" ;;
            skipped) echo "  ok    outillage : rien n'a bouge, matrice sautee" ;;
            *)       echo "  KO    outillage : $resultat" ; exit 1 ;;
          esac

  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.choix.outputs.apps }}
      deploy: ${{ steps.choix.outputs.deploy }}
      compose: ${{ steps.choix.outputs.compose }}
      outillage: ${{ steps.choix.outputs.outillage }}
      registry: ${{ steps.fab.outputs.registry }}
      org: ${{ steps.fab.outputs.org }}
      repo: ${{ steps.fab.outputs.repo }}
      image_max_mb: ${{ steps.fab.outputs.image_max_mb }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Ces quatre valeurs vivaient recopiees dans ce fichier a la generation.
      # Les relire ici, a chaque run, c'est ce qui permet a ce fichier de ne
      # plus dependre d'un generateur : un changement dans fabrique.yml se voit
      # au prochain run, sans repasser par ./init.sh.
      - id: fab
        run: |
          set -euo pipefail
          val() { sed -nE "s/^$1:[[:space:]]*([^[:space:]#]+).*/\1/p" fabrique.yml; }
          echo "registry=$(val registry)"       >> "$GITHUB_OUTPUT"
          echo "org=$(val org)"                 >> "$GITHUB_OUTPUT"
          echo "repo=$(val repo)"                >> "$GITHUB_OUTPUT"
          echo "image_max_mb=$(val image_max_mb)" >> "$GITHUB_OUTPUT"
      - id: choix
        env:
          EVENT: ${{ github.event_name }}
          TOUTES: ${{ inputs.toutes }}
          AVANT: ${{ github.event.before }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          APRES: ${{ github.sha }}
        run: |
          set -euo pipefail
          # La liste complete des apps, activees ou non : la CI les teste et
          # les construit sans egard a enabled, qui ne pilote que le compose.
          # Calculee ici plutot que figee a la generation.
          liste_toutes=$(for d in apps/*/; do
                           a="${d%/}"; a="${a#apps/}"
                           [ -f "apps/$a/app.yml" ] && printf '%s\n' "$a"
                         done)
          toutes='[]'
          if [ -n "$liste_toutes" ]; then
            toutes="[$(printf '%s\n' "$liste_toutes" | sed 's/.*/"&"/' | paste -sd, -)]"
          fi

          if [ "$EVENT" = pull_request ]; then base="$BASE_PR"; else base="$AVANT"; fi

          # Une base absente du depot — premiere poussee d'une branche, greffe,
          # force-push — donnerait un diff vide. On reconstruit tout plutot que
          # de ne rien construire en silence.
          tout=0
          if [ "$EVENT" = workflow_dispatch ] && [ "$TOUTES" = true ]; then
            tout=1
          elif [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "base de comparaison indisponible ($base) — reconstruction complete"
            tout=1
          fi

          # compose : le fichier a-t-il change DANS CE QUI EST POUSSE, avant
          # tout epinglage. C'est ce qui distingue « il y a quelque chose a
          # redeployer » de « on a seulement construit une image ». Faux quand
          # on reconstruit tout : l'epinglage fera bouger le compose de lui-meme,
          # et c'est lui qui tranchera.
          compose=false
          if [ "$tout" = 1 ]; then
            apps="$toutes"; deploy=true; outillage=true
          else
            changed=$(git diff --name-only "$base" "$APRES")
            echo "fichiers modifies :"; printf '  %s\n' $changed

            # Les tests de l'outillage ne peuvent changer d'avis que si
            # l'outillage change — ils ne testent que lui. Deux exceptions, et
            # elles sont dans la liste : test-init.sh travaille dans une COPIE
            # du depot ou il casse apps/hello-world, apps/cadran et
            # apps/ramure-v2 pour verifier que --check les nomme. Un manifeste
            # ou un Dockerfile qui bouge peut donc deplacer son resultat ; le
            # CODE d'une application, jamais — il n'entre dans aucun de ses cas.
            if printf '%s\n' "$changed" \
                 | grep -qE '^(init\.sh|fabrique\.yml|lib/|scripts/|test-[^/]*\.sh|\.github/workflows/)|^apps/[^/]+/(app\.yml|Dockerfile)$'; then
              outillage=true
            else
              outillage=false
            fi

            if printf '%s\n' "$changed" | grep -qE '^(fabrique\.yml|\.github/workflows/)'; then
              # La recette de construction a bouge — le workflow lui-meme, ou
              # les valeurs qu'il relit a chaque run et qui composent les tags.
              # Plus rien ne garantit que les images publiees ont ete faites
              # avec la recette courante.
              #
              # init.sh N'EST PLUS dans cette liste, et c'est deliberé : le
              # contexte de construction est « apps/<app> » et rien d'autre, si
              # bien qu'AUCUN fichier hors de ce repertoire n'entre dans une
              # image. Le generateur ne peut donc pas en changer une seule. Ce
              # qu'il change, c'est compose.yaml — un artefact COMMITTE, qui
              # apparait donc de lui-meme dans ce diff et declenche plus bas le
              # redeploiement. Et si le generateur devient plus severe, c'est le
              # job contrat qui le rattrape : il relit le depot ENTIER a chaque
              # run, sans egard a cette liste. On reconstruisait les six images
              # a chaque retouche du generateur — 4 fusions sur 20 mesurees sur
              # main, dont une qui ne touchait aucune application.
              apps="$toutes"
            else
              # Un repertoire sous apps/ n'est une application que s'il porte un
              # app.yml : c'est la definition qu'applique discover_apps, et la
              # seule qui vaille. Un chemin ne suffit pas. Sans ce filtre, un
              # fichier depose sous apps/<nom>/ avant que l'application n'existe
              # — une specification, une note — fait reclamer a la CI le test.sh
              # et le Dockerfile d'une app qui n'est pas encore ecrite, et le
              # job echoue sur un repertoire de documentation.
              # Le filtre porte sur l'arbre APRES le commit : une app ajoutee
              # dans ce meme commit a deja son app.yml et reste donc detectee,
              # ce qui fait bien construire sa premiere image.
              # Un if, et non « [ -f ] && printf » : l'etape tourne sous set -e,
              # un test faux ferait sortir la boucle en code 1 et echouer le job.
              liste=$(printf '%s\n' "$changed" | sed -nE 's#^apps/([^/]+)/.*#\1#p' | LC_ALL=C sort -u \
                        | while IFS= read -r a; do
                            if [ -f "apps/$a/app.yml" ]; then printf '%s\n' "$a"; fi
                          done)
              if [ -n "$liste" ]; then
                apps="[$(printf '%s\n' "$liste" | sed 's/.*/"&"/' | paste -sd, -)]"
              else
                apps='[]'
              fi
            fi

            if printf '%s\n' "$changed" | grep -qx 'compose.yaml'; then compose=true; fi

            # Redeployer seulement si une image change ou si le compose change :
            # sinon un commit de documentation redemarrerait toute la stack.
            if [ "$apps" != '[]' ] || [ "$compose" = true ]; then
              deploy=true
            else
              deploy=false
            fi
          fi

          echo "apps=$apps"           >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy"       >> "$GITHUB_OUTPUT"
          echo "compose=$compose"     >> "$GITHUB_OUTPUT"
          echo "outillage=$outillage" >> "$GITHUB_OUTPUT"
          echo "-> apps : $apps   deploy : $deploy   compose : $compose   outillage : $outillage"

  # Une matrice vide fait echouer le job : d'ou le garde sur '[]'.
  test:
    needs: [contrat, detect]
    if: needs.detect.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      # Chaque app dit comment elle se teste dans un executable, comme elle dit
      # comment elle se construit dans un Dockerfile : la fabrique n'a pas a
      # connaitre les langages. Le runner fournit Go, Node, Python et Java ;
      # pour une autre chaine, testez dans un etage du Dockerfile.
      - name: tests de ${{ matrix.app }}
        run: ./apps/${{ matrix.app }}/test.sh

  # La revue outillee — qualite, securite, dependances vulnerables, couverture,
  # duplication. Un job SEPARE de « test » et non une etape de plus : les deux
  # repondent a des questions differentes, et voir laquelle est rouge sans
  # ouvrir les journaux vaut la minute de runner que coute le second job. Ils
  # tournent en parallele, la duree du lot ne change donc pas.
  #
  # Elle ne depend PAS de « test » : une app dont les tests tombent a quand meme
  # des failles a montrer, et les deux verdicts se lisent mieux ensemble.
  revue:
    needs: [contrat, detect]
    if: needs.detect.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      # Les outils passent par « go run <module>@<version> » : sans cache, chaque
      # job les retelecharge et les recompile. La cle porte sur fabrique.yml,
      # seul endroit ou leurs versions sont ecrites — elle change donc quand, et
      # seulement quand, un outil change de version.
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.npm/_npx
          key: revue-${{ runner.os }}-${{ hashFiles('fabrique.yml') }}
          restore-keys: revue-${{ runner.os }}-
      # L'app est NOMMEE. Sans argument, revue.sh deduirait le perimetre de
      # « origin/main...HEAD » — introuvable sur le clone superficiel de la CI,
      # ou il ne relirait rien en annoncant un succes.
      - name: revue de ${{ matrix.app }}
        run: ./scripts/revue.sh ${{ matrix.app }}

  # Le bout en bout : un vrai navigateur, contre l'app reelle. C'est le seul job
  # qui voie ce que l'utilisateur voit — un test Go verifie que le serveur REND
  # du HTML, jamais ce que ce HTML devient dans un navigateur.
  #
  # Il inclut le passage d'accessibilite mesuree (@axe-core/playwright) : c'est
  # LUI, et lui seul, qui rend le contraste, l'atteignabilite au clavier et les
  # libelles de lecteur d'ecran bloquants. Le jugement UX qui ne se mesure pas
  # appartient a l'agent « esthete », en fin de branche ; les deux ne se
  # remplacent pas.
  #
  # Il ne depend PAS de « build » : les suites lancent l'app NATIVEMENT (go build
  # puis le binaire) et n'ont pas besoin d'une image publiee. Seules les apps qui
  # ont vraiment une annexe — ardoise et compteur, base et cache — montent leurs
  # conteneurs, et le runner fournit Docker.
  bout-en-bout:
    needs: [contrat, detect]
    if: needs.detect.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      # Le navigateur pese ~150 Mo et ne change qu'avec la version de Playwright
      # epinglee dans le package.json de la suite : la cle porte donc sur ce
      # fichier, et non sur le commit.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles(format('apps/{0}/e2e/package.json', matrix.app)) }}
          restore-keys: pw-${{ runner.os }}-
      - name: navigateur pour ${{ matrix.app }}
        run: |
          set -euo pipefail
          d="apps/${{ matrix.app }}/e2e"
          [ -x "$d/lancer.sh" ] || { echo "pas de suite — rien a installer"; exit 0; }
          # Une suite peut gerer ses dependances elle-meme : ramure-v2 rejoue
          # celle qui vit sous web/. Sans ce garde, « npm install --prefix » sur
          # un repertoire sans package.json echoue en ENOENT et casse le job
          # AVANT le premier test — sur une app dont la suite est pourtant
          # complete. Le navigateur, lui, s'installe dans tous les cas : c'est
          # un cache partage, et lancer.sh n'a pas a s'en occuper.
          if [ -f "$d/package.json" ]; then
            npm install --prefix "$d" --no-audit --no-fund
            ( cd "$d" && npx playwright install --with-deps chromium )
          else
            npx --yes playwright install --with-deps chromium
          fi
      # Tant que les dix suites n'existent pas, l'absence AVERTIT ; le jour ou la
      # derniere est ecrite, E2E_OBLIGATOIRE passe a 1 dans init.sh et --check
      # met KO — c'est --check qui porte le cran, pas ce job.
      - name: bout en bout de ${{ matrix.app }}
        run: |
          set -euo pipefail
          d="apps/${{ matrix.app }}/e2e"
          if [ -x "$d/lancer.sh" ]; then
            "$d/lancer.sh"
          else
            echo "::warning::${{ matrix.app }} n'a pas de suite bout en bout — rien ne la verifie dans un navigateur"
          fi

  build:
    needs: [contrat, detect, test]
    if: needs.detect.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      # Sans buildx, le driver par defaut est 'docker', qui ne sait pas
      # exporter de cache : le cache-to gha plus bas ferait echouer la
      # construction avant meme de lire le Dockerfile.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ needs.detect.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # CONSTRUIRE D'ABORD EN LOCAL, PUBLIER ENSUITE. Entre les deux se glisse le
      # seul controle capable de voir les labels de l'IMAGE. Docker fusionne dans
      # les labels du conteneur ceux qui sont graves dans l'image — y compris
      # ceux HERITES d'une image de BASE ou poses par un etage intermediaire, que
      # la lecture de apps/<app>/Dockerfile faite par « ./init.sh --check » ne
      # peut pas voir. Un « traefik.* » grave la publierait un routeur
      # SUPPLEMENTAIRE : il porte un autre nom que celui de compose.yaml, donc le
      # compose ne l'ecrase pas, et il arrive SANS middleware d'authentification —
      # constate avec Traefik 3.7.10. Le service principal, lui, est route :
      # traefik.enable=false ne le couvre pas, ce controle est sa seule parade.
      # L'etape de publication ci-dessous repart de ce cache : rien n'est
      # reconstruit, et surtout pas une image differente de celle qu'on inspecte.
      - name: construire ${{ matrix.app }} sans publier
        uses: docker/build-push-action@v6
        with:
          # Contexte reduit a l'app : c'est ce qui isole les constructions les
          # unes des autres et empeche une edition dans une app d'invalider le
          # cache de couches des autres.
          context: apps/${{ matrix.app }}
          file: apps/${{ matrix.app }}/Dockerfile
          # Sur une pull request on construit sans publier : la validation du
          # Dockerfile ne doit pas bouger le tag :main que le serveur suit.
          push: ${{ github.event_name != 'pull_request' }}
          # ... mais l'image doit alors entrer dans le demon local, sinon
          # l'etape suivante n'a rien a inspecter sur une pull request : sans
          # publication, l'image reste dans le cache de buildx, invisible a
          # « docker image inspect ». push et load s'excluent — jamais vrais
          # ensemble ici, c'est la meme condition inversee.
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ needs.detect.outputs.registry }}/${{ needs.detect.outputs.org }}/${{ needs.detect.outputs.repo }}/${{ matrix.app }}:main
            ${{ needs.detect.outputs.registry }}/${{ needs.detect.outputs.org }}/${{ needs.detect.outputs.repo }}/${{ matrix.app }}:${{ github.sha }}
          # Rattache le paquet au depot : ses permissions suivent alors celles
          # du depot, et un seul identifiant de lecture couvre toutes les apps.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ needs.detect.outputs.org }}/${{ needs.detect.outputs.repo }}
          # Identifie la version deployee ; le Dockerfile en fait ce qu'il veut,
          # l'ignorer est sans consequence.
          build-args: |
            VERSION=${{ github.sha }}
          # Le scope est obligatoire en matrice : sans lui les constructions
          # paralleles se disputent un cache unique et s'evincent l'une l'autre.
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      # Deux controles sur l'image finie, la seule chose que le serveur tirera.
      # Sur une pull request elle vient de « load », sur main du registre.
      - name: labels et taille de l'image
        run: |
          set -euo pipefail
          image=${{ needs.detect.outputs.registry }}/${{ needs.detect.outputs.org }}/${{ needs.detect.outputs.repo }}/${{ matrix.app }}:main
          if [ "${{ github.event_name }}" != pull_request ]; then
            docker pull "$image"
          fi

          # Le contrat interdit tout LABEL traefik.* dans un Dockerfile, et
          # --check le verifie. Mais il lit le Dockerfile, ou un label HERITE
          # d'une image de base n'apparait pas. Docker fusionne pourtant les
          # labels de l'image dans ceux du conteneur : le routeur ainsi publie
          # porte un autre nom que celui du compose, donc le compose ne peut
          # pas l'ecraser — il vivrait SANS middleware d'authentification.
          # L'image construite est le seul endroit ou un label herite se voit.
          # L'inspection est isolee du filtre, et c'est tout l'interet : dans
          # « inspect | grep ... || true », le « || true » couvre le PIPELINE
          # ENTIER. Une inspection en echec — image absente, tag mal forme,
          # demon indisponible — rendait alors une liste vide, indiscernable
          # d'une image saine, et le garde-fou annoncait « aucun label » en
          # sortant en succes. Un controle de securite qui echoue en ouvert est
          # pire que pas de controle : il rassure. Ici l'affectation echoue sous
          # « set -e » et l'etape s'arrete ; le « || true » ne couvre plus que
          # grep, dont le code 1 signifie « aucune correspondance », seul cas
          # ou l'absence de resultat est une bonne nouvelle.
          labels=$(docker image inspect "$image" \
                     --format '{{range $k, $v := .Config.Labels}}{{println $k}}{{end}}')
          graves=$(printf '%s\n' "$labels" | grep -iE '^traefik\.' || true)
          if [ -n "$graves" ]; then
            printf '::error::LABEL traefik grave dans l image ${{ matrix.app }} : %s\n' $graves
            echo "::error::Docker le fusionnerait dans les labels du conteneur et publierait un routeur SUPPLEMENTAIRE, sans authentification. Retire-le du Dockerfile, ou change d image de base : ce label n est pas ecrasable depuis le compose."
            exit 1
          fi
          echo "aucun label traefik.* — ni ecrit dans le Dockerfile, ni herite de l image de base"

          size=$(docker image inspect "$image" --format '{{.Size}}')
          echo "Image ${{ matrix.app }} : $((size / 1024 / 1024)) Mo"
          if [ "$size" -gt $(( ${{ needs.detect.outputs.image_max_mb }} * 1024 * 1024 )) ]; then
            echo "::warning::image au-dela de ${{ needs.detect.outputs.image_max_mb }} Mo — le serveur est a 92 % de disque"
          fi

  deploy:
    needs: [contrat, tests-de-l-outillage, detect, test, revue, bout-en-bout, build]
    # « sauté » et « échoué » doivent se distinguer : un build saute (rien a
    # reconstruire, mais le compose a change) doit laisser passer, un build en
    # echec doit bloquer. Sinon un commit a moitie construit referencerait une
    # image inexistante et emporterait les apps saines.
    #
    # Et il faut le dire de CHAQUE job attendu, un par un : « always() » desarme
    # le blocage implicite de « needs », si bien qu'un job absent de cette liste
    # peut echouer sans rien empecher. C'etait le cas de tests-de-l-outillage —
    # present dans « needs », nulle part ici : la mise en ligne partait meme
    # quand la preuve du verrou tombait. La ligne ci-dessous ferme ce trou en
    # meme temps qu'elle admet le saut, desormais le cas courant.
    # Ecriture entre crochets : un trait d'union est un signe de soustraction
    # dans une expression, « needs.tests-de-l-outillage » ne se lit pas.
    #
    # workflow_dispatch est admis a cote de push, et c'est ce qui rend l'entree
    # « toutes » utilisable. Elle promettait de tout reconstruire ; elle le
    # faisait — detect rend bien la liste complete et build publie les images —
    # mais ce job-ci s'arretait sur « event_name == push », si bien que rien
    # n'etait EPINGLE ni DEPLOYE : les images partaient au registre, versions.yml
    # gardait les anciens commits, et le compose que dockhand relit ne bougeait
    # pas d'une ligne. Le seul levier de rattrapage de la fabrique — celui qu'on
    # actionne quand la CI a rate des fusions, comme le 16 aout — s'arretait a
    # mi-chemin en annoncant un succes. La garde qui compte est celle de la
    # ligne suivante, « ref == refs/heads/main » : elle vaut pour les deux
    # evenements, et un dispatch sur une autre branche ne deploie pas davantage
    # qu'une poussee sur une autre branche.
    if: >-
      always()
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
      && needs.detect.outputs.deploy == 'true'
      && needs.contrat.result == 'success'
      && needs.detect.result == 'success'
      && (needs['tests-de-l-outillage'].result == 'success' || needs['tests-de-l-outillage'].result == 'skipped')
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
      && (needs.revue.result == 'success' || needs.revue.result == 'skipped')
      && (needs['bout-en-bout'].result == 'success' || needs['bout-en-bout'].result == 'skipped')
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # contents: write — ce job ECRIT sur main : il y enregistre la version de
    # chaque image qu'il vient de publier. C'est la seule ecriture de toute la
    # chaine, et elle ne porte que sur deux fichiers derives du build.
    permissions:
      contents: write
      packages: read
    steps:
      # Historique complet : ce job peut avoir a se rebaser sur main avant de
      # pousser, ce qu'un clone superficiel ne sait pas faire.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pas de setup-buildx-action ici : ce job ne CONSTRUIT rien. Son seul
      # usage de buildx est « imagetools inspect », un client de registre pur
      # qui n'a besoin d'aucun builder — buildx est preinstalle sur
      # ubuntu-latest, et l'authentification vient du login ci-dessous, pas du
      # builder. L'installer coutait une dizaine de secondes sur le chemin
      # critique du deploiement. Le job build, lui, le garde : son cache-to gha
      # en depend.
      - uses: docker/login-action@v3
        with:
          registry: ${{ needs.detect.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # LE PAS QUI REND LE DEPLOIEMENT SELECTIF.
      #
      # Le tag d'image etait « :main » pour toutes les apps, et il est mutable :
      # une image reconstruite ne changeait pas une ligne du compose. dockhand,
      # qui ne redeploie que sur un diff, ne voyait donc jamais rien passer — on
      # ne s'en sortait qu'avec « Force redeployment », c'est-a-dire en recreant
      # les NEUF conteneurs de la stack pour livrer une seule app.
      #
      # Ici, chaque app construite recoit le commit qui l'a construite comme tag.
      # Le compose porte alors une ligne image: differente pour la seule app
      # livree : « docker compose up » recree ce service-la et laisse les autres
      # conteneurs intacts. Le rayon de souffle d'une livraison tombe a l'app
      # qu'on livre — et le depot dit desormais quelle version tourne en ligne.
      - name: epingler la version des images construites
        id: pin
        if: needs.detect.outputs.apps != '[]'
        env:
          APPS: ${{ needs.detect.outputs.apps }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          pins=()
          for a in $(printf '%s' "$APPS" | tr -d '[]"' | tr ',' ' '); do
            pins+=(--pin "$a=$SHA")
          done
          ./init.sh "${pins[@]}" >/dev/null
          git --no-pager diff --stat
          # Une app construite mais desactivee n'a pas de bloc dans le compose :
          # sa version s'enregistre, mais il n'y a rien a redeployer. Distinguer
          # les deux ici evite d'appeler le webhook pour rien — et d'echouer sur
          # le « skipped » que dockhand renverrait alors a juste titre.
          if git diff --quiet -- compose.yaml; then
            echo "compose=false" >> "$GITHUB_OUTPUT"
            echo "aucun service du compose ne change — rien a redeployer"
          else
            echo "compose=true" >> "$GITHUB_OUTPUT"
          fi

      # Garde-fou propre a la stack unique : « docker compose up » est atomique
      # pour la stack entiere. Une seule image absente du registre le fait
      # echouer et emporte les applications saines. On verifie donc chaque
      # reference du compose AVANT d'appeler le webhook — le pire cas devient
      # « rien n'est deploye » au lieu de « tout tombe ».
      - name: toutes les images du compose sont tirables
        run: |
          set -euo pipefail
          # sort -u : la meme image peut etre referencee par plusieurs services
          # — une app et son worker partagent la leur — et l'inspecter deux fois
          # ne prouve rien de plus.
          mapfile -t images < <(sed -nE 's/^[[:space:]]*image:[[:space:]]*(.*)$/\1/p' compose.yaml | LC_ALL=C sort -u)
          if [ ${#images[@]} -eq 0 ]; then
            echo "::error::aucune image dans compose.yaml — la stack ne deploierait rien"
            exit 1
          fi
          # TOUTES les images sont verifiees, les TIERCES COMPRISES, et un echec
          # bloque. « docker buildx imagetools inspect » interroge le registre en
          # ANONYME quand il n'a pas d'identifiants, et l'inspection d'une image
          # publique aboutit sans login — mesure, docker deconnecte de tout
          # registre : l'inspection de valkey/valkey:8-alpine sort en 0, la meme
          # avec une faute de frappe sort en 1. Une image tierce mal
          # orthographiee ou disparue ferait echouer le « docker compose up »,
          # atomique pour la stack entiere : la laisser passer, c'est deployer
          # une fabrique qui tombe TOUTE. Une image tierce reellement privee est
          # le seul faux positif possible, et elle n'aurait de toute facon pas sa
          # place dans un compose que le serveur tire sans identifiants.
          # Onze images, un aller-retour registre chacune : en serie, une
          # quinzaine de secondes sur le chemin critique du deploiement. Le
          # verdict ne change pas d'un iota — toutes sont inspectees, tierces
          # comprises, et une seule manquante bloque encore.
          #
          # Chaque inspection ecrit dans SON fichier, numerote : deux sous-shells
          # qui appendent au meme fichier se marchent dessus, et une image
          # manquante disparaitrait en silence — soit exactement ce que cette
          # etape est la pour empecher.
          rapport=$(mktemp -d)
          n=0
          for img in "${images[@]}"; do
            n=$((n + 1))
            (
              if docker buildx imagetools inspect "$img" >/dev/null 2>&1; then
                printf '  ok   %s\n' "$img" > "$rapport/verdict.$n"
              else
                printf '  KO   %s\n' "$img" > "$rapport/verdict.$n"
                printf '%s\n'        "$img" > "$rapport/manquante.$n"
              fi
            ) &
          done
          # || true : sous « set -e », un wait qui rapporte le code non nul d'un
          # sous-shell tuerait l'etape avant qu'elle ait dit QUELLE image manque.
          wait || true
          # Trier, et non rendre les fiches dans l'ordre du glob : numerotees,
          # elles sortiraient 1, 10, 11, 2. Le tri porte sur la ligne entiere,
          # ce qui range par image ET remonte les KO en tete, ou on les cherche.
          cat "$rapport"/verdict.* | LC_ALL=C sort
          mapfile -t manquantes < <(cat "$rapport"/manquante.* 2>/dev/null || true)

          # Compter les verdicts rendus, et pas seulement lire ceux qui sont la.
          # Le « wait || true » ci-dessus jette les codes de sortie — il le doit,
          # sous set -e — si bien qu'un sous-shell tue entre l'ecriture de son
          # verdict et celle de sa fiche « manquante » laisserait passer une
          # image absente. Or c'est l'etape qui empeche la stack entiere de
          # tomber : elle doit avoir vu les $n images, pas « celles qui ont
          # repondu ». Meme raisonnement que le decompte des cas de test-init.sh,
          # et pour la meme raison — une verification amputee ressemble trait
          # pour trait a une verification qui passe.
          rendus=$(find "$rapport" -name 'verdict.*' | wc -l)
          rm -rf "$rapport"
          if [ "$rendus" -ne "$n" ]; then
            echo "::error::$n image(s) a inspecter, $rendus verdict(s) rendu(s) — l'inspection est incomplete, on ne deploie pas"
            exit 1
          fi
          if [ ${#manquantes[@]} -gt 0 ]; then
            printf '::error::image introuvable dans son registre : %s\n' "${manquantes[@]}"
            echo "::error::deploiement refuse — il ferait tomber toutes les apps de la stack"
            exit 1
          fi
          echo "${#images[@]} image(s) distincte(s) verifiee(s)"

      # Les versions epinglees n'ont d'effet que committees : c'est le depot que
      # dockhand relit, pas ce runner. On pousse APRES le controle ci-dessus et
      # AVANT le webhook — dans cet ordre exactement. Apres, parce qu'un tag
      # pointant vers une image absente resterait sinon sur main et ferait
      # echouer tous les deploiements suivants ; avant, parce que dockhand clone
      # le depot au moment ou on l'appelle.
      #
      # Le pousseur est la CLE DE DEPLOIEMENT, pas le GITHUB_TOKEN : une regle
      # de protection de main exige des controles de statut sur tout ce qui y
      # est pousse, et le commit d'epinglage porte « [skip ci] » — les controles
      # exiges ne tourneront donc jamais sur lui, et la regle le refuserait
      # toujours. Seule une cle de deploiement inscrite dans la Bypass list de
      # la regle peut l'ecrire ; le robot des Actions, lui, ne s'y inscrit pas
      # (GitHub ne le propose pas dans cette liste).
      #
      # Consequence a ne pas perdre de vue : contrairement au GITHUB_TOKEN, une
      # poussee faite par une cle de deploiement DECLENCHE les workflows. Ce qui
      # ferme la boucle « la CI committe, donc la CI repart », c'est donc
      # desormais le « [skip ci] » du message, et lui seul. Ne le retire pas.
      - name: enregistrer les versions deployees
        if: steps.pin.outputs.compose != ''
        env:
          APPS: ${{ needs.detect.outputs.apps }}
          SHA: ${{ github.sha }}
          CLE: ${{ secrets.DEPLOIEMENT_SSH_KEY }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # On indexe AVANT de juger : au tout premier epinglage, versions.yml
          # n'est pas encore suivi par git, et « git diff » ne voit pas un
          # fichier non suivi — la version aurait ete perdue sans un mot.
          git add versions.yml compose.yaml
          if git diff --cached --quiet; then
            echo "versions inchangees — rien a enregistrer"
            exit 0
          fi
          liste=$(printf '%s' "$APPS" | tr -d '[]"' | tr ',' ' ')
          git commit -q -m "deploiement : $liste sur ${SHA:0:7} [skip ci]" \
                        -m "Version epinglee par la CI. Le compose ne change que pour ces apps ; les autres conteneurs de la stack ne sont pas recrees."
          # La cle absente, on pousse comme avant, en HTTPS avec le GITHUB_TOKEN :
          # le depot reste utilisable tel quel — un fork, une copie, un depot ou
          # main n'est pas protege n'ont rien a configurer. La regle de
          # protection, elle, refusera cette poussee, et l'erreur en fin d'etape
          # dit alors exactement quoi poser.
          if [ -n "${CLE:-}" ]; then
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            # Une cle privee collee dans un secret perd souvent sa forme : des
            # retours chariot Windows, ou un corps replie sur UNE seule ligne
            # par un presse-papier — un telephone le fait sans prevenir. openssh
            # refuse alors la cle avec « error in libcrypto », message qui ne
            # dit ni quoi ni ou, puis git accuse les droits d'acces. On la remet
            # en forme avant de s'en servir, en shell : un heredoc ou un script
            # Python indente ne survivent pas a un bloc YAML, qui impose une
            # marge que ni le delimiteur ni Python n'acceptent — essaye et
            # constate le 18 aout 2026.
            brut=$(printf '%s' "$CLE" | tr -d '\r')
            # Le secret accepte DEUX formes. La seconde, en base64 sur une
            # seule ligne (`base64 -w0 cle-deploiement`), est la seule qu'un
            # presse-papier ne puisse pas abimer : ni retour a la ligne a
            # perdre, ni ligne a tronquer. On la reconnait a ce qu'elle ne
            # porte aucun en-tete de cle et se decode en un texte qui, lui, en
            # porte un — jamais a l'aveugle.
            compact=$(printf '%s' "$brut" | tr -d '[:space:]')
            case "$compact" in
              *-----BEGIN*) ;;
              *)
                decodee=$(printf '%s' "$compact" | base64 -d 2>/dev/null || true)
                case "$decodee" in
                  -----BEGIN*) brut="$decodee" ;;
                esac
                ;;
            esac
            if [ "$(printf '%s\n' "$brut" | wc -l)" -le 1 ]; then
              debut=$(printf '%s' "$brut" | grep -o -m1 -- '-----BEGIN [A-Z0-9 ]*-----' || true)
              fin=$(printf '%s' "$brut" | grep -o -m1 -- '-----END [A-Z0-9 ]*-----' || true)
              corps=$(printf '%s' "$brut" | sed -e "s|.*${debut}||" -e "s|${fin}.*||" | tr -d '[:space:]')
              if [ -z "$debut" ] || [ -z "$fin" ] || [ -z "$corps" ]; then
                echo "::error::secret DEPLOIEMENT_SSH_KEY : cle privee incomplete — recopie-la de la ligne BEGIN a la ligne END incluses, ou colle la sortie de « base64 -w0 cle-deploiement »"
                exit 1
              fi
              # Les espaces du corps sont retires AVANT le repliage : les garder
              # rendait une cle toujours invalide, mais joliment presentee.
              { printf '%s\n' "$debut"; printf '%s' "$corps" | fold -w 70; printf '\n%s\n' "$fin"; } > ~/.ssh/deploiement
            else
              printf '%s\n' "$brut" > ~/.ssh/deploiement
            fi
            chmod 600 ~/.ssh/deploiement
            # Verifier la cle AVANT de pousser : sinon son defaut se lit dans un
            # « Permission denied (publickey) », qui accuse les droits alors que
            # le probleme est la forme du secret. Seule l'empreinte publique est
            # affichee — elle se compare a celle listee dans Deploy keys.
            if ! ssh-keygen -y -f ~/.ssh/deploiement > /dev/null 2>&1; then
              echo "::error::secret DEPLOIEMENT_SSH_KEY : cle refusee par openssh — le secret n'est pas une cle privee entiere (copie tronquee ?). Recolle la sortie de « base64 -w0 cle-deploiement », insensible aux retours a la ligne"
              exit 1
            fi
            echo "cle de deploiement chargee — empreinte $(ssh-keygen -l -f ~/.ssh/deploiement | cut -d' ' -f2)"
            # La cle d'hote est epinglee par ssh-keyscan plutot que par
            # StrictHostKeyChecking=no : accepter n'importe quel hote sur un
            # runner jetable n'aurait rien verifie du tout.
            ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploiement -o IdentitiesOnly=yes"
            git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          else
            echo "::warning::secret DEPLOIEMENT_SSH_KEY absent — poussee en HTTPS, refusee si main est protege par des controles de statut"
          fi

          # Une poussee peut echouer parce qu'un humain a pousse entre-temps :
          # on se rebase et on retente, sans jamais forcer.
          for essai in 1 2 3 4; do
            if git push origin "HEAD:main"; then exit 0; fi
            echo "poussee refusee — tentative $essai"
            sleep $(( 2 ** essai ))
            git fetch origin main
            git rebase FETCH_HEAD
          done
          echo "::error::impossible d'enregistrer les versions sur main — rien n'est deploye"
          echo "::error::si le refus est « repository rule violations », la cle de deploiement (secret DEPLOIEMENT_SSH_KEY, avec acces en ecriture) doit figurer dans la Bypass list de la regle qui protege main"
          exit 1

      # LA LIVRAISON UNITAIRE — recreer le conteneur de la seule app livree.
      #
      # Le webhook, en dessous, recree TOUTE la stack, et ce n'est pas un
      # reglage a decocher. Dans le chemin git de dockhand, la variable qui
      # decide vaut « la synchronisation a vu un fichier changer » :
      #
      #   const forceRecreate = syncResult.updated;   src/lib/server/git.ts
      #
      # Elle est donc toujours vraie quand on deploie, et « --force-recreate »
      # est toujours ajoute. Le reglage « Force redeployment » de l'interface
      # est un SECOND levier, independant : il decide s'il faut deployer quand
      # RIEN n'a change, et le decocher ne retire pas l'option. Lu dans leur
      # source le 18 aout 2026, v1.0.42 ; signale chez eux depuis le 31 janvier
      # — Finsys/dockhand#419, toujours ouvert, sans reponse depuis le 8 aout.
      #
      # On passe donc a cote du chemin git pour la livraison ORDINAIRE — celle
      # ou seules des lignes image: ont bouge — et on demande a dockhand de
      # remplacer l'image d'un conteneur, un par un. Il le fait en gardant tout
      # le reste : labels Traefik, reseaux, volumes, limites, sonde. Les autres
      # conteneurs de la stack ne sont pas touches, et c'est tout l'objet.
      #
      # Deux choses tenues ici et nulle part ailleurs :
      #   - la copie du compose que dockhand garde a cote de la stack est mise a
      #     jour AVANT les conteneurs, et sans redemarrage : c'est elle que
      #     servirait un « Restart » depuis l'interface, et la laisser en
      #     arriere ferait revenir les images d'avant sans un mot ;
      #   - tout ecart de STRUCTURE — un service qui apparait, une limite, un
      #     volume, un label — repasse par le webhook : l'API des conteneurs
      #     sait remplacer une image, elle ne sait pas creer un service.
      #
      # Cote serveur, la porte de service doit couvrir les deux chemins appeles
      # ici, et rien d'autre ; le README donne la regle Traefik exacte.
      - name: livrer les apps une par une
        id: unitaire
        env:
          DOCKHAND_URL: ${{ secrets.DOCKHAND_URL }}
          DOCKHAND_TOKEN: ${{ secrets.DOCKHAND_TOKEN }}
          WEBHOOK: ${{ secrets.DOCKHAND_DEPLOY_WEBHOOK }}
          PIN_COMPOSE: ${{ steps.pin.outputs.compose }}
          PUSH_COMPOSE: ${{ needs.detect.outputs.compose }}
          AVANT: ${{ github.event.before }}
          REGISTRE: ${{ needs.detect.outputs.registry }}
        run: |
          set -euo pipefail

          # Ce qui empeche la livraison unitaire ne doit jamais empecher la
          # LIVRAISON : on repasse par le webhook, en disant pourquoi.
          repli() {
            echo "webhook=true" >> "$GITHUB_OUTPUT"
            echo "::warning::livraison unitaire ecartee — $1"
            echo "le deploiement repasse par le webhook : TOUTE la stack sera recreee"
            exit 0
          }

          # Aucun service du compose ne change : il n'y a rien a redeployer. Le
          # cas existe — une app construite mais encore desactivee, premier des
          # deux commits d'un ajout.
          if [ "$PIN_COMPOSE" != true ] && [ "$PUSH_COMPOSE" != true ]; then
            echo "compose.yaml inchange — images publiees, aucun conteneur a recreer"
            echo "webhook=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          [ -n "${DOCKHAND_URL:-}" ]   || repli "secret DOCKHAND_URL absent"
          [ -n "${DOCKHAND_TOKEN:-}" ] || repli "secret DOCKHAND_TOKEN absent"

          # L'identifiant de la pile se lit dans l'URL du webhook : un secret de
          # moins a poser, et deux valeurs qui ne peuvent pas se contredire.
          PILE_ID=$(printf '%s' "${WEBHOOK:-}" | sed -nE 's#^.*/api/git/stacks/([0-9]+)/webhook.*$#\1#p')
          [ -n "$PILE_ID" ] || repli "l URL du webhook ne porte pas d identifiant de pile"

          # Le compose a-t-il bouge AILLEURS que sur des lignes image: depuis ce
          # que le serveur fait tourner ? « github.event.before » est le dernier
          # commit deploye des lors que chaque poussee sur main deploie.
          [ -n "$AVANT" ] && git cat-file -e "${AVANT}^{commit}" 2>/dev/null \
            || repli "commit precedent inconnu de ce clone — declenchement manuel, ou historique tronque"
          bouge=$(git diff --no-color "$AVANT" -- compose.yaml | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' || true)
          [ -n "$bouge" ] || repli "compose.yaml identique a celui de $AVANT"
          if printf '%s\n' "$bouge" | grep -qvE '^[+-][[:space:]]*image:[[:space:]]'; then
            echo "le compose change ailleurs que sur des lignes image: —"
            printf '%s\n' "$bouge" | grep -vE '^[+-][[:space:]]*image:[[:space:]]' | head -20
            repli "changement de structure, que seul le deploiement complet sait poser"
          fi

          # Un seul point de sortie vers dockhand. Il distingue les trois echecs
          # qui ne se reparent pas au meme endroit : la porte fermee (redirection
          # vers Google, cote serveur), le jeton refuse (401, cote dockhand), et
          # le reste. Le corps de la reponse atterrit dans REPONSE.
          # La reponse atterrit dans un FICHIER, dont le chemin est dans REP :
          # les lectures qui suivent sont faites par un python dont le programme
          # arrive lui-meme par l'entree standard, qui n'est donc pas libre.
          REP=$(mktemp); export REP
          trap 'rm -f "$REP"' EXIT

          api() {  # api <methode> <chemin> [corps-json] — la reponse va dans $REP
            local methode="$1" chemin="$2" corps="${3:-}" code
            if [ -n "$corps" ]; then
              code=$(printf '%s' "$corps" | curl -sS -o "$REP" -w '%{http_code}' --max-time 300 \
                       -X "$methode" -H "Authorization: Bearer $DOCKHAND_TOKEN" \
                       -H 'content-type: application/json' --data-binary @- "$DOCKHAND_URL$chemin")
            else
              code=$(curl -sS -o "$REP" -w '%{http_code}' --max-time 60 \
                       -X "$methode" -H "Authorization: Bearer $DOCKHAND_TOKEN" "$DOCKHAND_URL$chemin")
            fi
            REPONSE=$(cat "$REP")
            case "$code" in
              200|201) return 0 ;;
              30*) echo "::error::$methode $chemin — redirection $code vers l authentification Google : la porte de service ne couvre pas ce chemin (README, « La porte de livraison »)" ;;
              401) echo "::error::$methode $chemin — 401, jeton refuse par dockhand" ;;
              *)   echo "::error::$methode $chemin — HTTP $code"; printf '%s' "$REPONSE" | head -c 400; echo ;;
            esac
            return 1
          }

          # Le nom de la pile — pour la copie du compose — et son environnement.
          api GET "/api/git/stacks/$PILE_ID"
          PILE=$(printf '%s' "$REPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("stackName",""))')
          ENV_ID=$(printf '%s' "$REPONSE" | python3 -c 'import json,sys; v=json.load(sys.stdin).get("environmentId"); print(v if v else "")')
          [ -n "$PILE" ] || repli "dockhand ne rend pas le nom de la pile $PILE_ID"
          Q=""
          if [ -n "$ENV_ID" ]; then Q="?env=$ENV_ID"; fi
          echo "pile « $PILE »${ENV_ID:+, environnement $ENV_ID}"

          # Les services de la fabrique et l'image que le compose leur donne.
          # Les annexes tierces — postgres, valkey — n'ont pas ce prefixe : cette
          # CI ne les construit pas, et leur tag ne bouge pas d'une livraison a
          # l'autre. Le nom du service EST le nom du conteneur, le generateur y
          # veille.
          attendu=$(python3 - "$REGISTRE/$GITHUB_REPOSITORY/" <<'PY'
          import re, sys
          prefixe = sys.argv[1]
          service = None
          for ligne in open('compose.yaml'):
              m = re.match(r'^  ([a-z0-9][a-z0-9-]*):\s*$', ligne)
              if m:
                  service = m.group(1)
                  continue
              m = re.match(r'^    image:\s*(\S+)\s*$', ligne)
              if m and service and m.group(1).startswith(prefixe):
                  print(service, m.group(1))
          PY
          )
          [ -n "$attendu" ] || repli "aucun service de la fabrique lu dans compose.yaml"

          # L'ecart entre le depot et l'hote, mesure AVANT le moindre geste. Il
          # ne se limite pas aux apps livrees a l'instant : une app restee en
          # arriere — fusion non construite, deploiement rate — est rattrapee
          # ici, et c'est le seul endroit de la chaine qui la voie.
          api GET "/api/containers$Q"
          a_livrer=$(python3 - "$attendu" <<'PY'
          import json, os, sys
          etat = {c["name"]: c.get("image", "") for c in json.load(open(os.environ["REP"]))}
          manque, bouge = [], []
          for ligne in sys.argv[1].splitlines():
              service, image = ligne.split()
              if service not in etat:
                  manque.append(service)
              elif etat[service] != image:
                  bouge.append((service, image))
          if manque:
              print("MANQUE " + " ".join(manque))
          else:
              for service, image in bouge:
                  print(service, image)
          PY
          )
          case "$a_livrer" in
            MANQUE*) repli "conteneur(s) absent(s) de l hote : ${a_livrer#MANQUE }" ;;
          esac
          if [ -z "$a_livrer" ]; then
            echo "les images en ligne sont deja celles du compose — rien a recreer"
            echo "webhook=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          corps=$(python3 -c 'import json; print(json.dumps({"content": open("compose.yaml").read(), "restart": False}))')
          api PUT "/api/stacks/$PILE/compose$Q" "$corps"
          echo "copie du compose mise a jour chez dockhand, sans redemarrage"

          while read -r service image; do
            [ -n "$service" ] || continue
            corps=$(python3 -c 'import json,sys; print(json.dumps({"image": sys.argv[1], "repullImage": True, "startAfterUpdate": True}))' "$image")
            api POST "/api/containers/$service/update$Q" "$corps"
            echo "  recree   $service   ->   ${image##*:}"
          done <<< "$a_livrer"

          # Un 200 ne vaut pas mise en ligne : on relit l'hote. Le 6 aout, un
          # webhook vert cachait un clone en panne, et l'echec ne s'est vu qu'a
          # l'oeil une heure plus tard sur l'URL de l'app.
          api GET "/api/containers$Q"
          ecarts=$(python3 - "$attendu" <<'PY'
          import json, os, sys
          etat = {c["name"]: c for c in json.load(open(os.environ["REP"]))}
          for ligne in sys.argv[1].splitlines():
              service, image = ligne.split()
              c = etat.get(service)
              if c is None:
                  print("%s : absent de l hote" % service)
              elif c.get("image", "") != image:
                  print("%s : tourne sur %s, le compose dit %s" % (service, c.get("image", ""), image))
              elif c.get("state") != "running":
                  print("%s : etat %s" % (service, c.get("state")))
          PY
          )
          if [ -n "$ecarts" ]; then
            printf '::error::%s\n' "$ecarts"
            echo "::error::livraison unitaire incomplete — l hote n est pas dans l etat du depot"
            exit 1
          fi
          echo "webhook=false" >> "$GITHUB_OUTPUT"
          echo "livraison unitaire faite — les autres conteneurs de la stack n ont pas bouge"

      # LE DEPLOIEMENT COMPLET, desormais le chemin de REPLI : il recree toute
      # la stack, quelques secondes d'indisponibilite pour toutes les apps. Il
      # reste le seul qui sache poser un changement de structure — un service
      # qui apparait ou disparait, une limite, un volume, un label.
      #
      # L'appel vient APRES la publication des images et APRES la poussee des
      # versions : dockhand clone le depot lui-meme et tire les images qu'il y
      # lit. Dans l'autre ordre, il deploierait l'etat d'avant.
      #
      # « Force redeployment » doit rester DECOCHE cote serveur : il ne commande
      # pas la recreation — voir le pas precedent —, il fait seulement deployer
      # quand rien n'a change, ce qui reveillerait la stack pour rien.
      #
      # L'URL est une URL de capacite : qui la connait declenche un
      # deploiement. Elle vit dans un secret du depot, jamais dans ce fichier.
      - name: declencher le deploiement
        if: steps.unitaire.outputs.webhook == 'true'
        env:
          WEBHOOK: ${{ secrets.DOCKHAND_DEPLOY_WEBHOOK }}
          WEBHOOK_SECRET: ${{ secrets.DOCKHAND_WEBHOOK_SECRET }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::secret DOCKHAND_DEPLOY_WEBHOOK absent — images publiees, deploiement NON declenche"
            exit 0
          fi

          # Un secret colle porte souvent un retour a la ligne invisible. Il
          # casserait la signature comme le jeton, pour un 403 indistinguable
          # d'un mauvais secret.
          secret=$(printf '%s' "$WEBHOOK_SECRET" | tr -d '\r\n')

          # Recette documentee par dockhand pour une CI generique : POST d'un
          # corps quelconque, signe en HMAC-SHA256. Le corps ne sert pas au
          # serveur, qui relit le depot lui-meme ; seule la signature compte.
          payload='{}'
          if [ -n "$secret" ]; then
            sig=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$secret" | awk '{print $NF}')
            set -- -H "x-hub-signature-256: sha256=$sig"
          else
            echo "::warning::secret DOCKHAND_WEBHOOK_SECRET absent — appel non signe, il sera refuse"
            set --
          fi

          # --max-time : c'etait le seul appel reseau non borne du fichier, quand
          # les deux appels de la livraison unitaire l'etaient deja. Un dockhand
          # qui accepte la connexion et ne repond jamais faisait pendre ce job
          # jusqu'au plafond GitHub de six heures — et, avec
          # cancel-in-progress: false sur main, tenait le groupe de concurrence
          # tout ce temps : plus aucun deploiement de la fabrique.
          # --max-time borne CHAQUE tentative, pas l'operation : a 300 s et trois
          # essais, le pire cas vaut 3x300 + 2x5 = 1210 s, soit plus que le
          # timeout-minutes: 20 de ce job. Le job serait tue AVANT que cette
          # etape ait pu dire lequel des trois essais a echoue et pourquoi. A
          # 120 s le pire cas tombe a 370 s, largement sous le plafond.
          code=$(curl -sS -o reponse.txt -w '%{http_code}' --max-time 120 --retry 3 --retry-delay 5 \
                   -X POST "$WEBHOOK" -H 'content-type: application/json' "$@" -d "$payload")
          echo "reponse HTTP $code :"
          cat reponse.txt; echo

          if [ "$code" = 403 ]; then
            echo "::error::403 — le secret envoye ne correspond pas a celui configure sur la stack dockhand"
            exit 1
          fi
          if [ "$code" -ge 400 ]; then
            echo "::error::le webhook a refuse l'appel — images publiees, rien n'est deploye"
            exit 1
          fi

          # Un 200 ne veut PAS dire deploye. dockhand rend « success: false » et
          # met la cause dans « error », sans changer le code HTTP. Constate le
          # 6 aout 2026 : le conteneur dockhand ne resolvait plus github.com,
          # son clone du depot echouait, le job « deploy » etait vert, et
          # l'echec ne s'est vu qu'a l'oeil une heure plus tard sur l'URL de
          # l'app. Ce test-la vient en premier : il couvre toutes les causes de
          # refus, la ou celui du dessous n'en couvre qu'une.
          if grep -q '"success":[[:space:]]*false' reponse.txt; then
            echo "::error::dockhand a refuse le deploiement — la cause est dans le champ « error » de la reponse ci-dessus. Les images sont publiees, RIEN n'est deploye."
            exit 1
          fi

          # dockhand ne redeploie que s'il voit un commit nouveau, et repond 200
          # quand il saute : sans ce test, la CI serait verte et le serveur
          # servirait toujours les images d'avant. On n'arrive ici qu'avec un
          # compose.yaml qui a bel et bien change et ete pousse — un saut ne
          # peut donc plus vouloir dire « rien a faire », il veut dire que
          # dockhand n'a pas vu la poussee.
          if grep -q '"skipped":[[:space:]]*true' reponse.txt; then
            echo "::error::dockhand a saute le deploiement alors que compose.yaml a change sur main."
            echo "::error::Il n'a pas vu la poussee : verifie que la stack suit bien la branche main de ce depot, et que son clone n'est pas bloque (le conteneur dockhand doit resoudre github.com)."
            exit 1
          fi
          echo "deploiement declenche"
